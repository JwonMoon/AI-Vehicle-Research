<text x="44" y="42" text-anchor="start" font-size="20" font-weight="700" fill="#0f172a">세정 유체 공급 체인 — 리저버에서 노즐까지</text><text x="44" y="68" text-anchor="start" font-size="12.5" font-weight="400" fill="#64748b">괄호 안 수치는 AUMOVIO 공개 제품 사양. 공기 경로 배치와 분기 구조는 공개 설명을 바탕으로 한 본 보고서 재구성.</text><rect x="44" y="112.0" width="258" height="104" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="173.0" y="158.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0f172a">리저버</text><text x="173.0" y="184.4" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">PE HD(블로우) / PP(사출)</text><text x="173.0" y="240.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">2.5 ~ 4.0 L</text><text x="173.0" y="262.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">레벨 센서: reed-switch / 2-pin</text><line x1="306" y1="164.0" x2="323" y2="164.0" stroke="#475569" stroke-width="2.4" marker-end="url(#a)"/><rect x="328" y="112.0" width="258" height="104" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="457.0" y="158.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0f172a">워셔 펌프</text><text x="457.0" y="184.4" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">단일 / 이중 토출구</text><text x="457.0" y="240.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">2.0 ~ 4.0 bar</text><text x="457.0" y="262.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">EMC 보호(고객 요구 기준)</text><line x1="590" y1="164.0" x2="607" y2="164.0" stroke="#475569" stroke-width="2.4" marker-end="url(#a)"/><rect x="612" y="112.0" width="258" height="104" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="741.0" y="158.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0f172a">호스 라인</text><text x="741.0" y="184.4" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">PA·PP 코러게이트, EPDM·TPV</text><text x="741.0" y="240.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">공기·액체 분리 배관</text><text x="741.0" y="262.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">커넥터 2·3세대, 색상 구분</text><line x1="874" y1="164.0" x2="891" y2="164.0" stroke="#475569" stroke-width="2.4" marker-end="url(#a)"/><rect x="896" y="112.0" width="258" height="104" rx="9" fill="#dcfce7" stroke="#0f8a5f" stroke-width="1.6"/><text x="1025.0" y="158.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0f172a">노즐 + 체크밸브</text><text x="1025.0" y="184.4" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">체크밸브 = 짧은 응답시간</text><text x="1025.0" y="240.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f8a5f">PTC 자기조절 히터</text><text x="1025.0" y="262.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">카메라와 조화된 발열 사양</text><rect x="44" y="324.0" width="258" height="62" rx="9" fill="#fdf6e7" stroke="#d9a63f" stroke-width="1.6"/><text x="173.0" y="349.2" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">압축 공기 공급</text><text x="173.0" y="373.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#7c5310">물방울·먼지 제거 (액체 절약)</text><path d="M308,355.0 L862,355.0 L862,164.0 L890,164.0" fill="none" stroke="#d9a63f" stroke-width="2.2" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="324" y="346.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#b45309">공기 경로 — 노즐에서 액체 경로와 합류</text><path d="M1025.0,288.0 L1025.0,410.0 L173.0,410.0" fill="none" stroke="#0f8a5f" stroke-width="2.2"/><rect x="44" y="444.0" width="258" height="89" rx="9" fill="#f6faf8" stroke="#0f8a5f" stroke-width="1.6"/><text x="173.0" y="474.6" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">윈드실드 노즐</text><text x="173.0" y="499.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">ball · fluidic · multi-spray ·</text><text x="173.0" y="515.3" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">laser-drilled</text><line x1="173.0" y1="410.0" x2="173.0" y2="439.0" stroke="#0f8a5f" stroke-width="2.2" marker-end="url(#ag)"/><rect x="328" y="444.0" width="258" height="89" rx="9" fill="#f6faf8" stroke="#0f8a5f" stroke-width="1.6"/><text x="457.0" y="482.7" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">wet-arm 노즐</text><text x="457.0" y="507.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">와이퍼 블레이드 바로 앞에 분사</text><line x1="457.0" y1="410.0" x2="457.0" y2="439.0" stroke="#0f8a5f" stroke-width="2.2" marker-end="url(#ag)"/><rect x="612" y="444.0" width="258" height="89" rx="9" fill="#f6faf8" stroke="#0f8a5f" stroke-width="1.6"/><text x="741.0" y="482.7" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">카메라 노즐</text><text x="741.0" y="507.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">액체(Coanda) + 공기 + 배수</text><line x1="741.0" y1="410.0" x2="741.0" y2="439.0" stroke="#0f8a5f" stroke-width="2.2" marker-end="url(#ag)"/><rect x="896" y="444.0" width="258" height="89" rx="9" fill="#f6faf8" stroke="#0f8a5f" stroke-width="1.6"/><text x="1025.0" y="482.7" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">라이다 lidome 노즐</text><text x="1025.0" y="507.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">평면·원형 lidome 대응</text><line x1="1025.0" y1="410.0" x2="1025.0" y2="439.0" stroke="#0f8a5f" stroke-width="2.2" marker-end="url(#ag)"/><path d="M173.0,410.0 L1025.0,410.0" fill="none" stroke="#0f8a5f" stroke-width="2.2"/><text x="44" y="573.0" text-anchor="start" font-size="11" font-weight="400" fill="#8a93a0">출처: aumovio.com — Optical Sensors &amp; Windshield Cleaning Systems (2026-09-07 수집)</text>
