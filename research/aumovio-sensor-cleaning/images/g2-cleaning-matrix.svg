<text x="44" y="42" text-anchor="start" font-size="20" font-weight="700" fill="#0f172a">세정 4대 수단 × 오염 유형 적합도</text><text x="44" y="68" text-anchor="start" font-size="12.5" font-weight="400" fill="#64748b">수단 목록과 “먼지는 공기만으로” 원칙은 AUMOVIO 공식 설명. 오염 유형별 적합도 판정은 본 보고서 해석.</text><text x="368.2" y="114.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">먼지·분진</text><text x="516.6" y="114.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">진흙·유막</text><text x="665.0" y="114.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">물방울</text><text x="813.4000000000001" y="114.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">서리·결빙</text><text x="961.8000000000001" y="114.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">벌레 잔해</text><rect x="44" y="134.0" width="232" height="68" rx="9" fill="#dbeafe" stroke="#1c5cab" stroke-width="1.6"/><text x="160.0" y="162.2" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">공기 (air)</text><text x="160.0" y="186.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">가압 공기 제트</text><rect x="299.0" y="134.0" width="138.4" height="68" rx="7" fill="#fbfcfd" stroke="#e2e5ea"/><circle cx="368.2" cy="156.0" r="9.5" fill="#0f8a5f"/><text x="368.2" y="185.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">주 수단</text><rect x="447.4" y="134.0" width="138.4" height="68" rx="7" fill="#fbfcfd" stroke="#e2e5ea"/><circle cx="516.6" cy="156.0" r="9.5" fill="#b9c0cb"/><text x="516.6" y="185.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">제한적</text><rect x="595.8" y="134.0" width="138.4" height="68" rx="7" fill="#fbfcfd" stroke="#e2e5ea"/><circle cx="665.0" cy="156.0" r="9.5" fill="#0f8a5f"/><text x="665.0" y="185.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">주 수단</text><rect x="744.2" y="134.0" width="138.4" height="68" rx="7" fill="#fb