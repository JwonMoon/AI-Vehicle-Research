 fill="#0f8a5f"/><text x="961.8000000000001" y="265.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">주 수단</text><rect x="44" y="294.0" width="232" height="68" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="160.0" y="322.2" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">가열 (heating)</text><text x="160.0" y="346.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">PTC 자기조절 히터</text><rect x="299.0" y="294.0" width="138.4" height="68" rx="7" fill="#fbfcfd" stroke="#e2e5ea"/><circle cx="368.2" cy="316.0" r="9.5" fill="#b9c0cb"/><text x="368.2" y="345.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">제한적</text><rect x="447.4" y="294.0" width="138.4" height="68" rx="7" fill="#fbfcfd" stroke="#e2e5ea"/><circle cx="516.6" cy="316.0" r="9.5" fill="#b9c0cb"/><text x="516.6" y="345.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">제한적</text><rect x="595.8" y="294.0" width="138.4" height="68" rx="7" fill="#fbfcfd" stroke="#e2e5ea"/><circle cx="665.0" cy="316.0" r="9.5" fill="#d9a63f"/><text x="665.0" y="345.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">보조</text><rect x="744.2" y="294.0" width="138.4" height="68" rx="7" fill="#fbfcfd" stroke="#e2e5ea"/><circle cx="813.4000000000001" cy="316.0" r="9.5" fill="#0f8a5f"/><text x="813.4000000000001" y="345.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">주 수단</text><rect x="892.6" y="294.0" width="138.4" height="68" rx="7" fill="#fbfcfd" stroke="#e2e5ea"/><circle cx="961.8000000000001" cy="316.0" r="9.5" fill="#b9c0cb"/><text x="961.8000000000001" y="345.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">제한적</text><rect x="44" y="374.0" width="232" height="68" rx="9" fill="#dcfce7" stroke="#0f8a5f" stroke-width="1.6"/><text x="160.0" y="402.2" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">검출 (detection)</text><text x="160.0" y="426.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">오염도 자가 감시</text><rect x="299.0" y="374.0" width="138.4" height="68" rx="7" fill="#fbfcfd" stroke="#e2e5ea"/><circle cx="368.2" cy="396.0" r="9.5" fill="#1c5cab"/><text x="368.2" y="425.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">트리거 판단</text><rect x="447.4" y="374.0" width="138.4" height="68" rx="7" fill="#fbfcfd" stroke="#e2e5ea"/><circle cx="516.6" cy="396.0" r="9.5" fill="#1c5cab"/><text x="516.6" y="425.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">트리거 판단</text><rect x="595.8" y="374.0" width="138.4" height="68" rx="7" fill="#fbfcfd" stroke="#e2e5ea"/><circle cx="665.0" cy="396.0" r="9.5" fill="#1c5cab"/><text x="665.0" y="425.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">트리거 판단</text><rect x="744.2" y="374.0" width="138.4" height="68" rx="7" fill="#fbfcfd" stroke="#e2e5ea"/><circle cx="813.4000000000001" cy="396.0" r="9.5" fill="#1c5cab"/><text x="813.4000000000001" y="425.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">트리거 판단</text><rect x="892.6" y="374.0" width="138.4" height="68" rx="7" fill="#fbfcfd" stroke="#e2e5ea"/><circle cx="961.8000000000001" cy="396.0" r="9.5" fill="#1c5cab"/><text x="961.8000000000001" y="425.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">트리거 판단</text><text x="44" y="484.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a">핵심 설계 원칙 — “먼지는 공기만으로 제거해 세정액을 아낀다”(Using air only to remove dust – saves liquid).</text><text x="44" y="510.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">세정액은 차량에 2.5~4.0 L만 실려 있는 유한 자원이므로, 오염 유형에 맞는 최소 수단 선택이 곧 가용 주행 시간을 결정한다.</text><text x="44" y="540.0" text-anchor="start" font-size="11" font-weight="400" fill="#8a93a0">검출은 세정 수단이 아니라 어떤 수단을 쓸지 고르는 트리거이므로 별도 표기.</text><text x="44" y="558.0" text-anchor="start" font-size="11" font-weight="400" fill="#8a93a0">출처: aumovio.com — Optical Sensors &amp; Windshield Cleaning Systems (2026-09-07 수집) · 적합도 판정은 본 보고서 해석</text>
