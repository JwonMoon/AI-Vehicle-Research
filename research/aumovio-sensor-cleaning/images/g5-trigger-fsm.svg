<text x="44" y="42" text-anchor="start" font-size="20" font-weight="700" fill="#0f172a">오염 검출 · 세정 트리거 로직 (재구성)</text><text x="44" y="68" text-anchor="start" font-size="12.5" font-weight="400" fill="#64748b">근거: Continental Sensor Array — 센서가 스스로 오염도를 감시해 자동 세정 + AUMOVIO 공기·액체·가열 단계 구성.</text><text x="44" y="88.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#64748b">상태 전이 구조는 공개된 기능 설명을 바탕으로 본 보고서가 재구성한 것이며 AUMOVIO 공식 사양이 아니다.</text><rect x="410.0" y="134.0" width="280" height="74" rx="9" fill="#dcfce7" stroke="#0f8a5f" stroke-width="1.6"/><text x="550.0" y="165.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">정상 감시 (Monitoring)</text><text x="550.0" y="190.2" text-anchor="middle" font-size="12" font-weight="400" fill="#14532d">soiling detection 상시 동작</text><rect x="410.0" y="262.0" width="280" height="74" rx="9" fill="#dbeafe" stroke="#1c5cab" stroke-width="1.6"/><text x="550.0" y="293.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">오염 판정 (Classify)</text><text x="550.0" y="318.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1e3a8a">먼지 / 물방울 / 진흙 / 결빙</text><line x1="550.0" y1="212.0" x2="550.0" y2="257.0" stroke="#1c5cab" stroke-width="2.2" marker-end="url(#ab)"/><text x="564.0" y="242.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#1c5cab">오염도 임계 초과</text><rect x="44" y="402.0" width="300" height="74" rx="9" fill="#fdf6e7" stroke="#d9a63f" stroke-width="1.6"/><text x="194.0" y="433.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">공기 분사</text><text x="194.0" y="458.2" text-anchor="middle" font-size="12" font-weight="400" fill="#7c5310">먼지 · 물방울</text><path d="M550.0,340.0 L194.0,397.0" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="378" y="402.0" width="300" height="74" rx="9" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.6"/><text x="528.0" y="433.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">액체 + 공기</text><text x="528.0" y="458.2" text-anchor="middle" font-size="12" font-weight="400" fill="#312e81">진흙 · 유막</text><path d="M550.0,340.0 L528.0,397.0" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="712" y="402.0" width="300" height="74" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="862.0" y="433.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">히터 가동</text><text x="862.0" y="458.2" text-anchor="middle" font-size="12" font-weight="400" fill="#7f1d1d">서리 · 결빙</text><path d="M550.0,340.0 L862.0,397.0" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="410.0" y="542.0" width="280" height="74" rx="9" fill="#eff1f4" stroke="#94a3b8" stroke-width="1.6"/><text x="550.0" y="573.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">세정 효과 검증</text><text x="550.0" y="598.2" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">재측정 → 오염도 임계 이하?</text><path d="M194.0,480.0 L550.0,537.0" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><path d="M528.0,480.0 L550.0,537.0" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><path d="M862.0,480.0 L550.0,537.0" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><path d="M406.0,579.0 L28,579.0 L28,171.0 L405.0,171.0" fill="none" stroke="#0f8a5f" stroke-width="2.2" marker-end="url(#ag)"/><text x="42" y="159.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f8a5f">해소 → 감시 복귀</text><rect x="380.0" y="674.0" width="340" height="52" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="550.0" y="704.9" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">기능 축퇴 / 운전자 인계 요구</text><path d="M694.0,579.0 L1052,579.0 L1052,700.0 L725.0,700.0" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#ar)"/><text x="1042" y="567.0" text-anchor="end" font-size="12.5" font-weight="400" fill="#dc2626">재시도 한계 초과</text><text x="44" y="764.0" text-anchor="start" font-size="11" font-weight="400" fill="#8a93a0">근거: continental.com Sensor Array 보도자료(2022-09-15) · 상태 전이 구조는 본 보고서 재구성</text>
</svg>
