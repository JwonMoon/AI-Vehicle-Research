<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
<rect width="1120" height="540" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c5cab"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f8a5f"/></marker>
</defs>
<text x="44" y="42" text-anchor="start" font-size="20" font-weight="700" fill="#0f172a">센서 오염이 인지 파이프라인에 전파되는 경로</text><text x="44" y="68" text-anchor="start" font-size="12.5" font-weight="400" fill="#64748b">오염은 부품 고장(ISO 26262)이 아니라 의도된 기능의 성능 한계(SOTIF, ISO 21448)로 취급된다.</text><rect x="44" y="106.0" width="186" height="89" rx="9" fill="#fef3c7" stroke="#d9a63f" stroke-width="1.6"/><text x="137.0" y="144.8" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">물리 오염</text><text x="137.0" y="170.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#7f1d1d">진흙·먼지·물방울·서리·벌레</text><line x1="233" y1="150.5" x2="248" y2="150.5" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><rect x="252" y="106.0" width="186" height="89" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="345.0" y="136.8" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">센서 신호 열화</text><text x="345.0" y="162.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#7f1d1d">SNR 저하·광량 손실·포인트</text><text x="345.0" y="178.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#7f1d1d">결손</text><line x1="441" y1="150.5" x2="456" y2="150.5" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><rect x="460" y="106.0" width="186" height="89" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="553.0" y="136.8" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">인지 성능 저하</text><text x="553.0" y="162.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#7f1d1d">검출률↓ 오검출↑</text><text x="553.0" y="178.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#7f1d1d">거리오차↑</text><line x1="649" y1="150.5" x2="664" y2="150.5" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><rect x="668" y="106.0" width="186" height="89" rx="9" fill="#fecaca" stroke="#dc2626" stroke-width="1.6"/><text x="761.0" y="144.8" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">판단·계획 오류</text><text x="761.0" y="170.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#7f1d1d">VLA·플래너 추론 흔들림</text><line x1="857" y1="150.5" x2="872" y2="150.5" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><rect x="876" y="106.0" width="186" height="89" rx="9" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.6"/><text x="969.0" y="144.8" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">기능 축퇴·해제</text><text x="969.0" y="170.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#7f1d1d">ODD 이탈 → 운전자 인계</text><rect x="44" y="269.0" width="496.0" height="74" rx="9" fill="#dcfce7" stroke="#0f8a5f" stroke-width="1.6"/><text x="292.0" y="300.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">세정 시스템 개입 지점</text><text x="292.0" y="325.2" text-anchor="middle" font-size="12" font-weight="400" fill="#14532d">공기·액체·가열로 물리 오염을 물리적으로 제거</text><rect x="580.0" y="269.0" width="496.0" height="74" rx="9" fill="#dbeafe" stroke="#1c5cab" stroke-width="1.6"/><text x="828.0" y="300.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">오염 검출 (soiling detection)</text><text x="828.0" y="325.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1e3a8a">센서가 자기 오염도를 감시 → 세정 트리거</text><line x1="292.0" y1="265.0" x2="137.0" y2="201.0" stroke="#0f8a5f" stroke-width="2" marker-end="url(#ag)"/><line x1="828.0" y1="265.0" x2="345.0" y2="201.0" stroke="#1c5cab" stroke-width="2" marker-end="url(#ab)"/><text x="44" y="389.0" text-anchor="start" font-size="13.5" font-weight="500" fill="#334155">※ 세정은 첫 두 단계에서 열화 사슬을 끊는 유일한 물리적 수단이다. 알고리즘 보정은 이미 잃어버린 광자를 복구하지 못한다.</text><text x="44" y="419.0" text-anchor="start" font-size="11" font-weight="400" fill="#8a93a0">근거: SoilingNet (arXiv:1905.01492) — “카메라는 다른 센서보다 오염에 의한 성능 저하가 훨씬 크다”</text><text x="44" y="437.0" text-anchor="start" font-size="11" font-weight="400" fill="#8a93a0">근거: AUMOVIO 제품 페이지 — 오염 요인으로 dust, rain, snow, insects 명시</text><text x="44" y="455.0" text-anchor="start" font-size="11" font-weight="400" fill="#8a93a0">도해: 본 보고서 자작</text>
</svg>
