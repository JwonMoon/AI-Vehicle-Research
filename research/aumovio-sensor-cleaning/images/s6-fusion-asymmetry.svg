<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
<rect width="1180" height="560" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c5cab"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f8a5f"/></marker>
</defs>
<text x="44" y="42" text-anchor="start" font-size="20" font-weight="700" fill="#0f172a">융합은 만능이 아니다 — 센서 소실의 비대칭</text><text x="44" y="68" text-anchor="start" font-size="12.5" font-weight="400" fill="#64748b">왼쪽: Seeing Through Fog(CVPR 2020) 실측 AP. 오른쪽: Yu et al.(CVPRW 2023)의 결론. 두 결과는 서로 다른 데이터셋·모델이며 '방향'만 비교한다.</text><text x="44" y="114.0" text-anchor="start" font-size="14" font-weight="700" fill="#0f172a">STF 데이터셋 3D 검출 AP — 맑음 vs 짙은 안개</text><text x="44" y="160.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#334155">카메라 단독</text><rect x="194" y="148.0" width="358.68000000000006" height="30" rx="4" fill="#1c5cab" opacity="0.35"/><text x="560.6800000000001" y="168.0" text-anchor="start" font-size="12" font-weight="400" fill="#334155">맑음 85.4</text><rect x="194" y="186.0" width="369.18000000000006" height="30" rx="4" fill="#1c5cab"/><text x="571.1800000000001" y="206.0" text-anchor="start" font-size="12" font-weight="700" fill="#1c5cab">짙은 안개 87.9</text><text x="44" y="256.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#334155">라이다 단독</text><rect x="194" y="244.0" width="308.7" height="30" rx="4" fill="#0f8a5f" opacity="0.35"/><text x="510.7" y="264.0" text-anchor="start" font-size="12" font-weight="400" fill="#334155">맑음 73.5</text><rect x="194" y="282.0" width="121.80000000000001" height="30" rx="4" fill="#0f8a5f"/><text x="323.8" y="302.0" text-anchor="start" font-size="12" font-weight="700" fill="#0f8a5f">짙은 안개 29.0</text><text x="44" y="352.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#334155">엔트로피 조향 융합</text><rect x="194" y="340.0" width="377.16" height="30" rx="4" fill="#4f46e5" opacity="0.35"/><text x="579.1600000000001" y="360.0" text-anchor="start" font-size="12" font-weight="400" fill="#334155">맑음 89.8</text><rect x="194" y="378.0" width="368.34000000000003" height="30" rx="4" fill="#4f46e5"/><text x="570.34" y="398.0" text-anchor="start" font-size="12" font-weight="700" fill="#4f46e5">짙은 안개 87.7</text><text x="44" y="444.0" text-anchor="start" font-size="12" font-weight="400" fill="#475569">안개에서 라이다는 −45.4 AP 급락, 카메라는 유지 → 융합이 카메라 쪽으로 무게를 옮겨 87.7 확보</text><rect x="654" y="96.0" width="482" height="360.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/><text x="674" y="128.0" text-anchor="start" font-size="14.5" font-weight="700" fill="#dc2626">반대 방향의 경고 (Yu et al.)</text><text x="674" y="156.0" text-anchor="start" font-size="12" font-weight="400" fill="#334155">nuScenes·Waymo 기반 융합 모델 벤치마크 결과:</text><text x="674" y="175.0" text-anchor="start" font-size="12" font-weight="400" fill="#334155">“대부분의 융합 방법은 LiDAR 입력이 교란되면 불가피하게 실패”한다.</text><text x="674" y="194.0" text-anchor="start" font-size="12" font-weight="400" fill="#334155">카메라 입력의 기여는 LiDAR에 비해 “현저히 열등”하다.</text><text x="674" y="232.0" text-anchor="start" font-size="12" font-weight="400" fill="#7f1d1d">→ 오늘의 융합 모델은 LiDAR 의존적이다. 카메라가 더러워지면 버티지만,</text><text x="674" y="251.0" text-anchor="start" font-size="12" font-weight="400" fill="#7f1d1d">   LiDAR 커버가 더러워지면 무너진다.</text><text x="674" y="289.0" text-anchor="start" font-size="12" font-weight="400" fill="#7f1d1d">→ 두 결과를 합치면: 어떤 센서가 오염됐느냐에 따라 시스템 취약성이</text><text x="674" y="308.0" text-anchor="start" font-size="12" font-weight="400" fill="#7f1d1d">   완전히 달라진다. 오염 검출은 '있다/없다'가 아니라 '어느 센서가'까지</text><text x="674" y="327.0" text-anchor="start" font-size="12" font-weight="400" fill="#7f1d1d">   알려줘야 융합이 대응할 수 있다. (본 보고서 해석)</text><text x="44" y="520" text-anchor="start" font-size="11" font-weight="400" fill="#8a93a0">출처: Bijelic et al., CVPR 2020 (arXiv:1902.08913) Table · Yu et al., arXiv:2205.14951 / CVPRW 2023 · 도해는 본 보고서 자작</text>
</svg>
