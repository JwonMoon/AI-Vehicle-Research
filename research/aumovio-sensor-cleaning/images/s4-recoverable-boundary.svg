<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
<rect width="1180" height="560" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c5cab"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f8a5f"/></marker>
</defs>
<text x="44" y="42" text-anchor="start" font-size="20" font-weight="700" fill="#0f172a">소프트웨어가 복원할 수 있는 것과 없는 것</text><text x="44" y="68" text-anchor="start" font-size="12.5" font-weight="400" fill="#64748b">기준: 오염이 광자를 '왜곡'했는가 '차단'했는가. 왜곡은 되돌릴 수 있지만 차단된 정보는 추정만 가능하다. 구분은 SoilingNet의 투명/불투명 분류에 본 보고서의 해석을 더한 것.</text><rect x="44.0" y="110.0" width="345.3333333333333" height="330" rx="13" fill="#dcfce7" stroke="#0f8a5f" stroke-width="2"/><text x="216.66666666666666" y="144.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">투명 오염</text><text x="216.66666666666666" y="166.0" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">물방울 · 얇은 유막 · 흐림</text><circle cx="216.66666666666666" cy="260.0" r="58" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><circle cx="216.66666666666666" cy="260.0" r="34" fill="#cbd5e1" opacity="0.5"/><ellipse cx="228.66666666666666" cy="252.0" rx="30" ry="22" fill="#5b4636" opacity="0.85"/><text x="216.66666666666666" y="346.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">광자가 도달하되 굴절·산란</text><text x="216.66666666666666" y="372.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f8a5f">복원 가능 (deraining · deblur · 물방울 제거)</text><rect x="417.3333333333333" y="110.0" width="345.3333333333333" height="330" rx="13" fill="#fdf6e7" stroke="#d9a63f" stroke-width="2"/><text x="590.0" y="144.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">반투명 · 부분 오염</text><text x="590.0" y="166.0" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">흙탕물 튐 · 성에 · 먼지막</text><circle cx="590.0" cy="260.0" r="58" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><circle cx="590.0" cy="260.0" r="34" fill="#cbd5e1" opacity="0.5"/><ellipse cx="602.0" cy="252.0" rx="30" ry="22" fill="#5b4636" opacity="0.5"/><text x="590.0" y="346.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">일부 광자만 통과, 대비 급감</text><text x="590.0" y="372.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#d9a63f">부분 복원 — 주변 프레임·타 센서로 보간</text><rect x="790.6666666666666" y="110.0" width="345.3333333333333" height="330" rx="13" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="963.3333333333333" y="144.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">불투명 오염</text><text x="963.3333333333333" y="166.0" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">진흙 덩어리 · 벌레 · 눈 덩이</text><circle cx="963.3333333333333" cy="260.0" r="58" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><circle cx="963.3333333333333" cy="260.0" r="34" fill="#cbd5e1" opacity="0.5"/><ellipse cx="975.3333333333333" cy="252.0" rx="30" ry="22" fill="#5b4636" opacity="0.15"/><text x="963.3333333333333" y="346.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">해당 영역 광자 0</text><text x="963.3333333333333" y="372.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#dc2626">복원 불가 — 마스킹 후 타 센서·과거 정보에 의존</text><text x="44" y="474.0" text-anchor="start" font-size="11" font-weight="400" fill="#8a93a0">근거: SoilingNet(arXiv:1905.01492) 투명/불투명 구분 · Eigen et al. ICCV 2013(국소 오염 복원) · Yang et al. Sensors 2026(“같은 면적 ≠ 같은 심각도”)</text><text x="44" y="492.0" text-anchor="start" font-size="11" font-weight="400" fill="#8a93a0">'광자 차단 = 복원 불가'는 본 보고서 해석. 생성 모델은 그럴듯한 픽셀을 만들 수 있으나 실제 장면 정보는 아니다.</text>
</svg>
