<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="차량 안에서 데이터가 흐르는 구간별 직렬화 지도 — 구간마다 이미 정해진 표준이 무엇이고 Cap'n Proto·Protobuf 가 들어갈 자리가 있는지">
<rect width="1240" height="760" fill="#ffffff"/>

<text x="40" y="44" font-size="23" font-weight="700" fill="#15181d">차량 안에서 데이터가 흐르는 구간들 — 어디에 무엇이 이미 앉아 있나</text>
<text x="40" y="70" font-size="14" fill="#4d545e">「차량에 도입 가능한가」는 구간마다 답이 다르다. 아래로 갈수록 하드웨어에 가깝고, 표준이 굳어 있어 바꿀 여지가 작다.</text>

<!-- 범례 -->
<g>
  <rect x="40" y="86" width="11" height="11" rx="2.5" fill="#1baf7a"/><text x="57" y="96" font-size="12" fill="#4d545e">자리가 있다</text>
  <rect x="150" y="86" width="11" height="11" rx="2.5" fill="#d9a63f"/><text x="167" y="96" font-size="12" fill="#4d545e">조건부</text>
  <rect x="234" y="86" width="11" height="11" rx="2.5" fill="#eb6834"/><text x="251" y="96" font-size="12" fill="#4d545e">자리가 없다</text>
  <text x="352" y="96" font-size="12" fill="#848a94">실선 테두리 = 표준 문서·측정으로 확인 · 점선 = 프로젝트마다 다른 판단 영역</text>
</g>

<!-- 열 머리글 -->
<text x="56" y="126" font-size="12" font-weight="700" fill="#848a94">구간</text>
<text x="248" y="126" font-size="12" font-weight="700" fill="#848a94">지금 거기 있는 것</text>
<text x="486" y="126" font-size="12" font-weight="700" fill="#848a94">데이터 성격</text>
<text x="716" y="126" font-size="12" font-weight="700" fill="#848a94">Cap&#39;n Proto · Protobuf 가 들어갈 자리</text>

<!-- L6 클라우드 -->
<g>
  <rect x="40" y="134" width="1160" height="86" rx="9" fill="#f7f9fb" stroke="#cdd3db"/>
  <rect x="40" y="134" width="6" height="86" rx="3" fill="#848a94"/>
  <text x="60" y="160" font-size="13.5" font-weight="700" fill="#15181d">L6 · 차량 ↔ 클라우드</text>
  <text x="60" y="180" font-size="11.5" fill="#848a94">텔레메트리 · OTA</text>
  <text x="60" y="198" font-size="11.5" fill="#848a94">원격진단</text>
  <text x="248" y="160" font-size="12.5" fill="#4d545e">HTTPS/MQTT 위 <tspan font-weight="700">Protobuf</tspan>·JSON</text>
  <text x="248" y="180" font-size="11.5" fill="#848a94">gRPC 를 쓰는 곳도 많다</text>
  <text x="486" y="160" font-size="12.5" fill="#4d545e">간헐적 · 통신비가 곧 돈</text>
  <text x="486" y="180" font-size="11.5" fill="#848a94">대역폭 &gt; CPU</text>
  <rect x="716" y="148" width="22" height="11" rx="3" fill="#1baf7a"/>
  <text x="746" y="158" font-size="12.5" font-weight="700" fill="#15181d">Protobuf 의 본진.</text>
  <text x="716" y="180" font-size="12" fill="#4d545e">크기가 작고 서버·툴 생태계가 이미 있다.</text>
  <text x="716" y="199" font-size="12" fill="#4d545e">Cap&#39;n Proto 는 여기서 이길 이유가 없다.</text>
</g>

<!-- L5 ECU간 이더넷 -->
<g>
  <rect x="40" y="228" width="1160" height="96" rx="9" fill="#ffffff" stroke="#cdd3db"/>
  <rect x="40" y="228" width="6" height="96" rx="3" fill="#848a94"/>
  <text x="60" y="254" font-size="13.5" font-weight="700" fill="#15181d">L5 · ECU ↔ ECU</text>
  <text x="60" y="273" font-size="13.5" font-weight="700" fill="#15181d">(차량 이더넷)</text>
  <text x="60" y="294" font-size="11.5" fill="#848a94">서비스 지향 통신</text>
  <text x="60" y="312" font-size="11.5" fill="#848a94">AUTOSAR Adaptive·Classic</text>
  <text x="248" y="254" font-size="12.5" fill="#4d545e"><tspan font-weight="700">SOME/IP</tspan> — AUTOSAR 고유 직렬화</text>
  <text x="248" y="274" font-size="12.5" fill="#4d545e"><tspan font-weight="700">DDS</tspan> — CDR 직렬화</text>
  <text x="248" y="294" font-size="11.5" fill="#848a94">둘 다 ara::com 바인딩으로 표준화</text>
  <text x="486" y="254" font-size="12.5" fill="#4d545e">주기적 · 지연 예산이 빡빡</text>
  <text x="486" y="274" font-size="12.5" fill="#4d545e">UDP 페이로드 <tspan font-weight="700">0~1400 B</tspan></text>
  <text x="486" y="294" font-size="11.5" fill="#848a94">(SOME/IP 규격 상한)</text>
  <rect x="716" y="242" width="22" height="11" rx="3" fill="#eb6834"/>
  <text x="746" y="252" font-size="12.5" font-weight="700" fill="#15181d">대체재로는 자리가 없다.</text>
  <text x="716" y="274" font-size="12" fill="#4d545e">직렬화가 표준에 박혀 있다. 페이로드 안에 다른</text>
  <text x="716" y="293" font-size="12" fill="#4d545e">포맷을 &#39;봉투에 넣어&#39; 보낼 수는 있지만 이중 직렬화가</text>
  <text x="716" y="312" font-size="12" fill="#4d545e">되고, 진단·게이트웨이 도구가 내용을 못 읽는다.</text>
</g>

<!-- L4 SoC 내부 IPC -->
<g>
  <rect x="40" y="332" width="1160" height="110" rx="9" fill="#f7fafd" stroke="#2a78d6" stroke-width="1.8"/>
  <rect x="40" y="332" width="6" height="110" rx="3" fill="#2a78d6"/>
  <text x="60" y="358" font-size="13.5" font-weight="700" fill="#2a78d6">L4 · 같은 SoC 안</text>
  <text x="60" y="377" font-size="13.5" font-weight="700" fill="#2a78d6">프로세스 간 (IPC)</text>
  <text x="60" y="398" font-size="11.5" fill="#848a94">인지 → 예측 → 계획</text>
  <text x="60" y="416" font-size="11.5" fill="#848a94">로깅 · 리플레이</text>
  <text x="60" y="434" font-size="11.5" font-weight="700" fill="#2a78d6">← 이 보고서의 관심 지점</text>
  <text x="248" y="358" font-size="12.5" fill="#4d545e">ROS 2 (DDS/CDR) · Autoware</text>
  <text x="248" y="378" font-size="12.5" fill="#4d545e">Apollo CyberRT</text>
  <text x="248" y="396" font-size="11.5" fill="#848a94">(Protobuf + 공유메모리)</text>
  <text x="248" y="416" font-size="12.5" fill="#4d545e">iceoryx · Zenoh · eCAL</text>
  <text x="248" y="434" font-size="11.5" fill="#848a94">표준이 아니라 &#39;선택&#39;의 영역</text>
  <text x="486" y="358" font-size="12.5" fill="#4d545e">대역폭 무제한 (같은 메모리)</text>
  <text x="486" y="378" font-size="12.5" fill="#4d545e">메시지가 크다 — 점군·영상</text>
  <text x="486" y="398" font-size="12.5" fill="#4d545e">빈도가 높다 — 10~100 Hz</text>
  <text x="486" y="420" font-size="11.5" fill="#848a94">병목은 대역폭이 아니라</text>
  <text x="486" y="436" font-size="11.5" font-weight="700" fill="#4d545e">CPU 와 복사</text>
  <rect x="716" y="346" width="22" height="11" rx="3" fill="#1baf7a"/>
  <text x="746" y="356" font-size="12.5" font-weight="700" fill="#15181d">Cap&#39;n Proto 가 가장 말이 되는 구간.</text>
  <text x="716" y="378" font-size="12" fill="#4d545e">실측에서 1 MiB 디코딩 9.1배, 헤더 한 필드만 읽기</text>
  <text x="716" y="397" font-size="12" fill="#4d545e">653배 빨랐다(§4.2).</text>
  <text x="716" y="419" font-size="12" fill="#4d545e">단, 이 구간의 진짜 최적해는 「직렬화를 더 빨리」가 아니라</text>
  <text x="716" y="436" font-size="12" fill="#4d545e"><tspan font-weight="700">「공유메모리로 복사를 0으로」</tspan>다 — iceoryx·CyberRT 의 길.</text>
</g>

<!-- L3 센서 입력 -->
<g>
  <rect x="40" y="450" width="1160" height="78" rx="9" fill="#ffffff" stroke="#cdd3db"/>
  <rect x="40" y="450" width="6" height="78" rx="3" fill="#848a94"/>
  <text x="60" y="476" font-size="13.5" font-weight="700" fill="#15181d">L3 · 센서 → SoC</text>
  <text x="60" y="496" font-size="11.5" fill="#848a94">카메라·라이다·레이다</text>
  <text x="248" y="476" font-size="12.5" fill="#4d545e">MIPI CSI-2 · 벤더 고유 UDP</text>
  <text x="248" y="496" font-size="11.5" fill="#848a94">하드웨어·드라이버가 결정</text>
  <text x="486" y="476" font-size="12.5" fill="#4d545e">초당 수백 MB~GB</text>
  <text x="486" y="496" font-size="11.5" fill="#848a94">고정 레이아웃 원시 버퍼</text>
  <rect x="716" y="464" width="22" height="11" rx="3" fill="#eb6834"/>
  <text x="746" y="474" font-size="12.5" font-weight="700" fill="#15181d">자리가 없다.</text>
  <text x="716" y="496" font-size="12" fill="#4d545e">여기서 필요한 건 DMA 와 하드웨어 포맷이지 IDL 이 아니다.</text>
</g>

<!-- L2 CAN -->
<g>
  <rect x="40" y="536" width="1160" height="78" rx="9" fill="#ffffff" stroke="#cdd3db"/>
  <rect x="40" y="536" width="6" height="78" rx="3" fill="#848a94"/>
  <text x="60" y="562" font-size="13.5" font-weight="700" fill="#15181d">L2 · CAN / CAN FD / LIN</text>
  <text x="60" y="582" font-size="11.5" fill="#848a94">파워트레인·섀시·바디</text>
  <text x="248" y="562" font-size="12.5" fill="#4d545e">DBC 로 정의한 <tspan font-weight="700">비트 시그널</tspan></text>
  <text x="248" y="582" font-size="11.5" fill="#848a94">「17번 비트부터 12비트가 RPM」</text>
  <text x="486" y="562" font-size="12.5" fill="#4d545e">프레임당 8 B (FD 64 B)</text>
  <text x="486" y="582" font-size="11.5" fill="#848a94">1비트도 아깝다</text>
  <rect x="716" y="550" width="22" height="11" rx="3" fill="#eb6834"/>
  <text x="746" y="560" font-size="12.5" font-weight="700" fill="#15181d">자리가 없다.</text>
  <text x="716" y="582" font-size="12" fill="#4d545e">Cap&#39;n Proto 는 최소 단위가 8바이트 워드라 구조적으로 부적합.</text>
</g>

<!-- L1 HW -->
<rect x="40" y="622" width="1160" height="40" rx="9" fill="#eff1f4" stroke="#cdd3db"/>
<text x="60" y="647" font-size="13" font-weight="700" fill="#4d545e">L1 · 하드웨어 — SoC · MCU · 이더넷 스위치 · 트랜시버</text>

<!-- 결론 -->
<rect x="40" y="670" width="1160" height="42" rx="9" fill="#e6eff9" stroke="#2a78d6" stroke-dasharray="5 4"/>
<text x="60" y="696" font-size="13" fill="#15181d">정리: <tspan font-weight="700">5개 구간 중 직렬화 포맷을 &#39;고를 수 있는&#39; 곳은 L4 와 L6 둘뿐</tspan>이다. Cap&#39;n Proto 의 후보 자리는 사실상 L4 하나다.</text>

<text x="40" y="740" font-size="11.5" fill="#848a94">출처: SOME/IP 페이로드 상한은 AUTOSAR SOME/IP Protocol 규격 · Apollo CyberRT·ROS 2 구성은 각 프로젝트 문서 · L4 수치는 본 보고서 자체 측정. 계층 구분은 본 보고서 해석. · 자체 작성</text>
</svg>
