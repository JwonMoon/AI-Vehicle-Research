<text x="186.37" y="607.5" font-size="11.5" fill="#1f2328" font-weight="normal" text-anchor="start">가중치: HF</text>
<text x="60" y="636" font-size="11.5" fill="#59636e" font-weight="bold" text-anchor="start">Autoware와의 관계</text>
<text x="60" y="655" font-size="11.5" fill="#1f2328" font-weight="normal" text-anchor="start">Autoware Core 위에서 실행. README:</text>
<text x="60" y="672" font-size="11.5" fill="#1f2328" font-weight="normal" text-anchor="start">'Autoware 경로 검사 뒤에 연결하라'</text>
<rect x="348" y="478" width="288" height="240" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<text x="364" y="507" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="start">LatentDrive</text>
<text x="364" y="531" font-size="12.5" fill="#1f2328" font-weight="bold" text-anchor="start">앞 카메라 영상만 보고 경로를 내는 AI</text>
<text x="364" y="556" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">보는 것: 전방 카메라 1·3대 + 경로점</text>
<text x="364" y="583" font-size="11.5" fill="#59636e" font-weight="bold" text-anchor="start">제공 형태</text>
<rect x="364" y="592" width="100.18" height="22" rx="11" fill="#fff" stroke="#59636e" stroke-width="1.1"/>
<text x="372" y="607.5" font-size="11.5" fill="#1f2328" font-weight="normal" text-anchor="start">C++ 라이브러리</text>
