<text x="998" y="110" font-size="17" fill="#fff" font-weight="bold" text-anchor="start">② 운전 보조(ADAS) · 개인차량 트랙</text>
<text x="998" y="152" font-size="13" fill="#1f2328" font-weight="bold" text-anchor="start">Autoware 부품이 아닌, 혼자 도는 완성 프로그램</text>
