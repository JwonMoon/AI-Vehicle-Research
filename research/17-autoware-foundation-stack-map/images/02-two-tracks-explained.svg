<text x="44" y="110" font-size="17" fill="#fff" font-weight="bold" text-anchor="start">① 로보택시 · 무인 셔틀 트랙  —  플랫폼: Autoware 2.0</text>
<text x="44" y="152" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Autoware = 차가 '보고 → 위치를 알고 → 길을 정하고 → 조작하는' 전 과정을 담은 큰 소프트웨어 묶음 (ROS 2 패키지 수백 개)</text>
<rect x="44" y="180" width="150" height="110" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
