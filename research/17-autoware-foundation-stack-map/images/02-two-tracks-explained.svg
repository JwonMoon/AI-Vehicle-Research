<text x="668" y="655" font-size="11.5" fill="#1f2328" font-weight="normal" text-anchor="start">Robotaxi WG가 개발. 저장소에</text>
<text x="668" y="672" font-size="11.5" fill="#1f2328" font-weight="normal" text-anchor="start">ROS·Autoware 연결 코드나 설명이 없음</text>
