<path d="M1383,566 L1383,554" fill="none" stroke="#c2410c" stroke-width="1.4"/>
<path d="M1071,554 L1466,554" fill="none" stroke="#c2410c" stroke-width="1.4"/>
<path d="M1466,554 L1466,306 L1322,306" fill="none" stroke="#c2410c" stroke-width="1.6" marker-end="url(#ao)"/>
<text x="1338" y="298" font-size="11.5" fill="#c2410c" font-weight="bold" text-anchor="start">들어 있음</text>
<text x="998" y="668" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">· 카메라 1대 + 저가 칩(3–5 TOPS) 목표, 지도 불필요</text>
<text x="998" y="692" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">· AutoE2E는 Vision Pilot에 들어 있지 않다 (코드 확인)</text>
<text x="998" y="716" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">· 최신 1.2 (2026-08), 1.3·안전 인증 작업 중</text>
<rect x="24" y="752" width="1452" height="150" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
<text x="44" y="780" font-size="15" fill="#047857" font-weight="bold" text-anchor="start">두 트랙이 같이 쓰는 기반</text>
