<text x="60" y="820" font-size="14" fill="#047857" font-weight="bold" text-anchor="start">Hugging Face (AI 모델 보관소)</text>
<text x="60" y="844" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Autoware 내장 AI 모델, OnePlanner,</text>
<text x="60" y="866" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">LatentDrive, AutoE2E 가중치를 버전별로 공개</text>
<rect x="524" y="794" width="460" height="92" rx="10" fill="#fff" stroke="#047857" stroke-width="1.3"/>
<text x="540" y="820" font-size="14" fill="#047857" font-weight="bold" text-anchor="start">Autoware Index (패키지 목록)</text>
<text x="540" y="844" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Autoware 밖 패키지를 등록·검증.</text>
