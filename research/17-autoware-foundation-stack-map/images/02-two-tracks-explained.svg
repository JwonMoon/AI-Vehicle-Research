<text x="289" y="236" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="middle">고정밀 지도</text>
<text x="289" y="258" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="middle">위치 추정</text>
