<text x="364" y="683" font-size="11.5" fill="#1f2328" font-weight="normal" text-anchor="start">Autoware 개발 이미지에서 실행. 녹화</text>
<text x="364" y="700" font-size="11.5" fill="#1f2328" font-weight="normal" text-anchor="start">재생으로 계획을 그리기만 함</text>
<rect x="652" y="478" width="288" height="240" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<text x="668" y="507" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="start">AutoE2E</text>
<text x="668" y="531" font-size="12.5" fill="#1f2328" font-weight="bold" text-anchor="start">카메라 6대로 주변을 보고 경로를 내는 AI</text>
<text x="668" y="556" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">보는 것: 서라운드 카메라 6대 (+지도 선택)</text>
<text x="668" y="583" font-size="11.5" fill="#59636e" font-weight="bold" text-anchor="start">제공 형태</text>
<rect x="668" y="592" width="142.04" height="22" rx="11" fill="#fff" stroke="#59636e" stroke-width="1.1"/>
<text x="676" y="607.5" font-size="11.5" fill="#1f2328" font-weight="normal" text-anchor="start">AI 모델 코드(Python)</text>
<rect x="816.04" y="592" width="77.18" height="22" rx="11" fill="#fff" stroke="#59636e" stroke-width="1.1"/>
