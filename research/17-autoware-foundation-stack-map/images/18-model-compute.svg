<text x="120.0" y="414.0" font-size="13" fill="#59636e" font-weight="normal" text-anchor="start">• 2.0.0 런치에 실제로 들어간 생성기는 규칙 기반과 Diffusion Planner 둘뿐이고, 한 번에 하나만 돈다.</text>
<text x="120.0" y="444.0" font-size="13" fill="#59636e" font-weight="normal" text-anchor="start">• POV 가이드: NVIDIA GPU는 지원, AMD · Qualcomm · Hailo-8 NPU는 로드맵. Jetson AGX Orin에서 AutoSeg FP16 약 29–30 FPS.</text>
<text x="120.0" y="474.0" font-size="13" fill="#1f2328" font-weight="bold" text-anchor="start">• R-Car X5H 한 칩에 AutoSD(Cortex-A720AE)와 FreeRTOS(Cortex-R52)를 함께 올리는 이식이 2026-09 완료됐다.</text>
