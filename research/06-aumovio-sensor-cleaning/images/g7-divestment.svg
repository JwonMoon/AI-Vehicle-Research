<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
<rect width="1120" height="640" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c5cab"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f8a5f"/></marker>
</defs>
<text x="44" y="42" text-anchor="start" font-size="20" font-weight="700" fill="#0f172a">CERTINA 매각 이후 인터페이스 경계 변화</text><text x="44" y="68" text-anchor="start" font-size="12.5" font-weight="400" fill="#64748b">2026-09-03 발표. 클로징은 관례적 선행조건 충족 시 2026년 말 예정.</text><rect x="44" y="114.0" width="494.0" height="366" rx="13" fill="#eff6ff" stroke="#1c5cab" stroke-width="2"/><text x="291.0" y="146.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1c5cab">매각 전 — AUMOVIO 내부 (사내 인터페이스)</text><rect x="582.0" y="114.0" width="494.0" height="366" rx="13" fill="#fdf6e7" stroke="#b45309" stroke-width="2"/><text x="829.0" y="146.0" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">매각 후 — 회사 간 인터페이스</text><rect x="66" y="168.0" width="214.0" height="64" rx="9" fill="#ffffff" stroke="#1c5cab" stroke-width="1.6"/><text x="173.0" y="204.4" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">센서 · 카메라 · 라이다</text><rect x="302.0" y="168.0" width="214.0" height="64" rx="9" fill="#ffffff" stroke="#1c5cab" stroke-width="1.6"/><text x="409.0" y="204.4" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">세정 시스템</text><line x1="284.0" y1="200.0" x2="297.0" y2="200.0" stroke="#1c5cab" stroke-width="2" marker-end="url(#ab)"/><rect x="66" y="254.0" width="450.0" height="64" rx="9" fill="#ffffff" stroke="#1c5cab" stroke-width="1.6"/><text x="291.0" y="290.4" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">오염 검출 SW · 세정 트리거 로직</text><text x="66" y="358.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#1e3a8a">· 히터 사양을 카메라와 맞춤(harmonized) 설계</text><text x="66" y="382.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#1e3a8a">· 검출–세정 응답을 한 조직이 조율</text><text x="66" y="406.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#1e3a8a">· 체코 Adršpach 생산·R&amp;D 포함, 약 700명</text><rect x="604.0" y="168.0" width="214.0" height="64" rx="9" fill="#ffffff" stroke="#1c5cab" stroke-width="1.6"/><text x="711.0" y="194.2" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">AUMOVIO 잔류</text><text x="711.0" y="217.4" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">센서 · 인지 SW · HPC</text><rect x="840.0" y="168.0" width="214.0" height="64" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/><text x="947.0" y="194.2" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">CERTINA 이관</text><text x="947.0" y="217.4" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">세정 하드웨어 일체</text><path d="M829.0,154.0 L829.0,246.0" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="8 5"/><text x="829.0" y="264.0" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">신규 회사 경계</text><rect x="604.0" y="278.0" width="450.0" height="64" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="829.0" y="314.4" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">오염 검출 SW · 세정 트리거 로직</text><text x="604.0" y="384.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#7c2d12">· 히터·노즐 사양 변경 시 사외 협의 필요</text><text x="604.0" y="408.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#7c2d12">· 검출 SW(AUMOVIO)와 액추에이터(CERTINA) 분리</text><text x="604.0" y="432.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#7c2d12">· SOTIF 검증 책임 분담이 새로운 계약 이슈</text><text x="44" y="520.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#0f172a">AUMOVIO CEO Philipp von Hirschheydt는 이번 매각을 “핵심 사업에 집중하는 더 큰 전략의 또 한 걸음”이라는 취지로 설명했다.</text><text x="44" y="550.0" text-anchor="start" font-size="11" font-weight="400" fill="#8a93a0">출처: aumovio.com 보도자료 (2026-09-03) · 경계 변화의 함의는 본 보고서 해석</text>
</svg>
