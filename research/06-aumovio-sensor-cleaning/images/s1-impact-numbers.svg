<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
<rect width="1180" height="640" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c5cab"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f8a5f"/></marker>
</defs>
<text x="44" y="42" text-anchor="start" font-size="20" font-weight="700" fill="#0f172a">센서 오염·악천후가 인지 성능에 미치는 실측 영향</text><text x="44" y="68" text-anchor="start" font-size="12.5" font-weight="400" fill="#64748b">각 수치는 개별 연구의 실험 조건에 종속된다. 서로 다른 데이터셋·모델 간 직접 비교는 불가하며, 오염이 '얼마나' 치명적인지의 크기감만 보여준다.</text><rect x="44.0" y="110.0" width="345.3333333333333" height="470" rx="13" fill="#eff6ff" stroke="#1c5cab" stroke-width="2"/><text x="216.66666666666666" y="144.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1c5cab">카메라</text><rect x="58.0" y="172.0" width="317.3333333333333" height="92" rx="8" fill="#ffffff" stroke="#e2e5ea"/><text x="70.0" y="194.0" text-anchor="start" font-size="12" font-weight="600" fill="#64748b">보행자 검출률</text><text x="70.0" y="216.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a">오염 심각도 Lv1 88.7% → Lv3 56.9%</text><text x="70.0" y="254.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#8a93a0">Yang et al., Sensors 2026</text><rect x="58.0" y="272.0" width="317.3333333333333" height="92" rx="8" fill="#ffffff" stroke="#e2e5ea"/><text x="70.0" y="294.0" text-anchor="start" font-size="12" font-weight="600" fill="#64748b">BEV 3D 검출 NDS</text><text x="70.0" y="316.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a">clean 0.517 → 눈(snow) 0.186 (−64%)</text><text x="70.0" y="354.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#8a93a0">RoboBEV, BEVFormer-base</text><rect x="58.0" y="372.0" width="317.3333333333333" height="92" rx="8" fill="#ffffff" stroke="#e2e5ea"/><text x="70.0" y="394.0" text-anchor="start" font-size="12" font-weight="600" fill="#64748b">보행자 검출 정확도</text><text x="70.0" y="416.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a">우천 8.3% → 공기압 차단 후 41.6%</text><text x="70.0" y="454.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#8a93a0">Sabry et al., arXiv 2602.17472</text><rect x="58.0" y="472.0" width="317.3333333333333" height="92" rx="8" fill="#ffffff" stroke="#e2e5ea"/><text x="70.0" y="494.0" text-anchor="start" font-size="12" font-weight="600" fill="#64748b">검출 mAP (시뮬)</text><text x="70.0" y="516.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a">비 0.68 / 안개 0.62 / 야간 0.54</text><text x="70.0" y="554.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#8a93a0">Wang &amp; Zhao, PLOS One 2025</text><rect x="417.3333333333333" y="110.0" width="345.3333333333333" height="470" rx="13" fill="#f0fdf4" stroke="#0f8a5f" stroke-width="2"/><text x="590.0" y="144.0" text-anchor="middle" font-size="18" font-weight="700" fill="#0f8a5f">라이다</text><rect x="431.3333333333333" y="172.0" width="317.3333333333333" height="92" rx="8" fill="#ffffff" stroke="#e2e5ea"/><text x="443.3333333333333" y="194.0" text-anchor="start" font-size="12" font-weight="600" fill="#64748b">3D 검출 AP</text><text x="443.3333333333333" y="216.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a">맑음 73.5 → 짙은 안개 29.0 (−45.4 AP)</text><text x="443.3333333333333" y="254.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#8a93a0">Bijelic et al., CVPR 2020 (STF)</text><rect x="431.3333333333333" y="272.0" width="317.3333333333333" height="92" rx="8" fill="#ffffff" stroke="#e2e5ea"/><text x="443.3333333333333" y="294.0" text-anchor="start" font-size="12" font-weight="600" fill="#64748b">커버 오염</text><text x="443.3333333333333" y="316.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a">이슬·인공 오염·거품 → “완전 실명” 관측</text><text x="443.3333333333333" y="354.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#8a93a0">Schlager et al., IEEE OJITS 2022</text><rect x="431.3333333333333" y="372.0" width="317.3333333333333" height="92" rx="8" fill="#ffffff" stroke="#e2e5ea"/><text x="443.3333333333333" y="394.0" text-anchor="start" font-size="12" font-weight="600" fill="#64748b">커버 오염 8종</text><text x="443.3333333333333" y="416.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a">clean·cover·water·mud·dust·salt·oil·</text><text x="443.3333333333333" y="434.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a">foam 데이터셋</text><text x="443.3333333333333" y="454.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#8a93a0">LIDAROC, IEEE Sensors Lett. 2024</text><rect x="431.3333333333333" y="472.0" width="317.3333333333333" height="92" rx="8" fill="#ffffff" stroke="#e2e5ea"/><text x="443.3333333333333" y="494.0" text-anchor="start" font-size="12" font-weight="600" fill="#64748b">물방울 오검출</text><text x="443.3333333333333" y="516.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a">“물방울이 전방 물체로 오인 → 급정지”</text><text x="443.3333333333333" y="554.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#8a93a0">Heinzler et al., RA-L 2020</text><rect x="790.6666666666666" y="110.0" width="345.3333333333333" height="470" rx="13" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="963.3333333333333" y="144.0" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">레이더</text><rect x="804.6666666666666" y="172.0" width="317.3333333333333" height="92" rx="8" fill="#ffffff" stroke="#e2e5ea"/><text x="816.6666666666666" y="194.0" text-anchor="start" font-size="12" font-weight="600" fill="#64748b">순수 물</text><text x="816.6666666666666" y="216.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a">두꺼운 영역 감쇠 −20 dB 초과</text><text x="816.6666666666666" y="254.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#8a93a0">Kang et al., Sensors 2025</text><rect x="804.6666666666666" y="272.0" width="317.3333333333333" height="92" rx="8" fill="#ffffff" stroke="#e2e5ea"/><text x="816.6666666666666" y="294.0" text-anchor="start" font-size="12" font-weight="600" fill="#64748b">건조 먼지</text><text x="816.6666666666666" y="316.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a">최대 −3 dB · 탐지거리 약 −10%</text><text x="816.6666666666666" y="354.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#8a93a0">동일</text><rect x="804.6666666666666" y="372.0" width="317.3333333333333" height="92" rx="8" fill="#ffffff" stroke="#e2e5ea"/><text x="816.6666666666666" y="394.0" text-anchor="start" font-size="12" font-weight="600" fill="#64748b">젖은 진흙</text><text x="816.6666666666666" y="416.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a">−10 ~ −20 dB, 건조 후 −1~−3 dB 잔류</text><text x="816.6666666666666" y="454.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#8a93a0">동일</text><rect x="804.6666666666666" y="472.0" width="317.3333333333333" height="92" rx="8" fill="#ffffff" stroke="#e2e5ea"/><text x="816.6666666666666" y="494.0" text-anchor="start" font-size="12" font-weight="600" fill="#64748b">기준선</text><text x="816.6666666666666" y="516.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a">편도 −6 dB = 탐지거리 50% 손실</text><text x="816.6666666666666" y="554.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#8a93a0">동일</text><text x="44" y="614.0" text-anchor="start" font-size="11" font-weight="400" fill="#8a93a0">출처는 각 카드 하단. 상세 서지는 본문 §8 · 도해는 본 보고서 자작</text>
</svg>
