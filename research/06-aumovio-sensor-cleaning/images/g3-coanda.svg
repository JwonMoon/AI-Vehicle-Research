<text x="44" y="42" text-anchor="start" font-size="20" font-weight="700" fill="#0f172a">Coanda 효과 기반 lidome · 렌즈 세정 원리</text><text x="44" y="68" text-anchor="start" font-size="12.5" font-weight="400" fill="#64748b">AUMOVIO 라이다·카메라 노즐은 “가압 액체 + Coanda 효과”로 곡면 전체를 덮는다고 명시한다.</text><text x="44" y="114.0" text-anchor="start" font-size="15" font-weight="700" fill="#0f172a">(a) 직분사 노즐 — 곡면에서 제트가 박리</text><text x="568.0" y="114.0" text-anchor="start" font-size="15" font-weight="700" fill="#0f172a">(b) Coanda 노즐 — 제트가 곡면에 부착</text><path d="M540.0,98.0 L540.0,418.0" fill="none" stroke="#e2e5ea" stroke-width="2"/><path d="M186.0,388.0 a92,92 0 0 1 184,0" fill="#eef1f5" stroke="#475569" stroke-width="2.5"/><path d="M162.0,388.0 L394.0,388.0" fill="none" stroke="#475569" stroke-width="2.5"/><rect x="130.0" y="370.0" width="32" height="18" rx="3" fill="#1c5cab"/><text x="146.0" y="362.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1c5cab">노즐</text><path d="M164.0,377.0 Q188.0,344.0 214.0,324.0 L316.0,238.0" fill="none" stroke="#1c5cab" stroke-width="2.2" opacity="0.75"/><path d="M164.0,377.0 Q188.0,340.0 214.0,318.0 L332.0,226.0" fill="none" stroke="#1c5cab" stroke-width="2.2" opacity="0.75"/><path d="M164.0,377.0 Q188.0,336.0 214.0,312.0 L348.0,214.0" fill="none" stroke="#1c5cab" stroke-width="2.2" opacity="0.75"/><text x="344.0" y="212.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#dc2626">곡률이 커지는 지점에서 제트 박리</text><path d="M292.0,298.0 A92,92 0 0 1 366.0,364.0" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="7 5"/><text x="404.0" y="326.0" text-anchor="start" font-size="12.5" font-weight="700" fill="#dc2626">세정 사각</text><text x="278.0" y="418.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">lidome (라이다 커버)</text><path d="M710.0,388.0 a92,92 0 0 1 184,0" fill="#eef1f5" stroke="#475569" stroke-width="2.5"/><path d="M686.0,388.0 L918.0,388.0" fill="none" stroke="#475569" stroke-width="2.5"/><path d="M688.0,377.0 L703.0,384.0 A99,99 0 0 1 901.0,384.0 L914.0,377.0" fill="none" stroke="#0f8a5f" stroke-width="9" opacity="0.28"/><path d="M688.0,377.0 L703.0,384.0 A99,99 0 0 1 901.0,384.0 L914.0,377.0" fill="none" stroke="#0f8a5f" stroke-width="2.6" marker-end="url(#ag)"/><rect x="654.0" y="370.0" width="32" height="18" rx="3" fill="#0f8a5f"/><text x="670.0" y="362.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f8a5f">노즐</text><text x="802.0" y="252.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#0f8a5f">저압 영역이 제트를 표면에 잡아둔다</text><text x="802.0" y="418.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f8a5f">곡면 전체 커버 · 동일 유량으로 더 넓은 면적</text><rect x="44" y="450.0" width="476.0" height="74" rx="9" fill="#dbeafe" stroke="#1c5cab" stroke-width="1.6"/><text x="282.0" y="481.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">공기 단계 (air)</text><text x="282.0" y="506.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1e3a8a">물방울 제거 → 라이다 가용성·감도 유지</text><rect x="560.0" y="450.0" width="476.0" height="74" rx="9" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.6"/><text x="798.0" y="481.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">배수 기능 (draining)</text><text x="798.0" y="506.2" text-anchor="middle" font-size="12" font-weight="400" fill="#312e81">잔여 액체를 흘려보내 재오염·결빙 방지</text><text x="44" y="558.0" text-anchor="start" font-size="11" font-weight="400" fill="#8a93a0">출처: aumovio.com — “Cleaning of lidome with pressurized liquid using Coanda effect”</text><text x="44" y="576.0" text-anchor="start" font-size="11" font-weight="400" fill="#8a93a0">Coanda 효과 정의 근거: 미국 특허 12,220,733 배경 설명 · 좌우 비교 도해는 본 보고서 자작 개념도</text>
