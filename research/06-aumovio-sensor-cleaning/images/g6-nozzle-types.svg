<text x="44" y="42" text-anchor="start" font-size="20" font-weight="700" fill="#0f172a">윈드실드 노즐 기술 4종과 wet-arm 시스템</text><text x="44" y="68" text-anchor="start" font-size="12.5" font-weight="400" fill="#64748b">수치(40% · 50% 절감)와 기술 목록은 AUMOVIO 공개 사양. 스프레이 패턴 묘사는 본 보고서 자작 개념도.</text><rect x="44" y="112.0" width="254" height="226" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/><text x="171.0" y="146.0" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0f172a">ball</text><text x="171.0" y="168.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">볼 조인트 · 분사각 조정 가능</text><rect x="155.0" y="301.0" width="32" height="18" rx="3" fill="#334155"/><path d="M171.0,299.0 L153.0,204.0" fill="none" stroke="#1c5cab" stroke-width="3.2" opacity="0.8"/><path d="M171.0,299.0 L171.0,204.0" fill="none" stroke="#1c5cab" stroke-width="3.2" opacity="0.8"/><path d="M171.0,299.0 L189.0,204.0" fill="none" stroke="#1c5cab" stroke-width="3.2" opacity="0.8"/><rect x="328" y="112.0" width="254" height="226" rx="11" fill="#f3faf6" stroke="#0f8a5f" stroke-width="2.4"/><text x="455.0" y="146.0" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0f172a">fluidic</text><text x="455.0" y="168.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">유체 진동 → 부채꼴 스윕</text><rect x="439.0" y="301.0" width="32" height="18" rx="3" fill="#334155"/><path d="M455.0,299.0 L385.0,204.0 L525.0,204.0 Z" fill="#1c5cab" stroke="none" stroke-width="0" opacity="0.2"/><path d="M455.0,299.0 L386.0,204.0" fill="none" stroke="#1c5cab" stroke-width="1.8" opacity="0.85"/><path d="M455.0,299.0 L409.0,204.0" fill="none" stroke="#1c5cab" stroke-width="1.8" opacity="0.85"/><path d="M455.0,299.0 L432.0,204.0" fill="none" stroke="#1c5cab" stroke-width="1.8" opacity="0.85"/><path d="M455.0,299.0 L455.0,204.0" fill="none" stroke="#1c5cab" stroke-width="1.8" opacity="0.85"/><path d="M455.0,299.0 L478.0,204.0" fill="none" stroke="#1c5cab" stroke-width="1.8" opacity="0.85"/><path d="M455.0,299.0 L501.0,204.0" fill="none" stroke="#1c5cab" stroke-width="1.8" opacity="0.85"/><path d="M455.0,299.0 L524.0,204.0" fill="none" stroke="#1c5cab" stroke-width="1.8" opacity="0.85"/><rect x="612" y="112.0" width="254" height="226" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/><text x="739.0" y="146.0" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0f172a">multi-spray</text><text x="739.0" y="168.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">다공 분사 → 넓은 면적</text><rect x="723.0" y="301.0" width="32" height="18" rx="3" fill="#334155"/><path d="M729.0,299.0 Q691.0,250.0 673.0,204.0" fill="none" stroke="#1c5cab" stroke-width="2.4" opacity="0.8"/><path d="M734.0,299.0 Q715.0,250.0 706.0,204.0" fill="none" stroke="#1c5cab" stroke-width="2.4" opacity="0.8"/><path d="M739.0,299.0 Q739.0,250.0 739.0,204.0" fill="none" stroke="#1c5cab" stroke-width="2.4" opacity="0.8"/><path d="M744.0,299.0 Q763.0,250.0 772.0,204.0" fill="none" stroke="#1c5cab" stroke-width="2.4" opacity="0.8"/><path d="M749.0,299.0 Q787.0,250.0 805.0,204.0" fill="none" stroke="#1c5cab" stroke-width="2.4" opacity="0.8"/><rect x="896" y="112.0" width="254" height="226" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/><text x="1023.0" y="146.0" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0f172a">laser-drilled</text><text x="1023.0" y="168.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">레이저 미세공 · 정밀 패턴</text><rect x="1007.0" y="301.0" width="32" height="18" rx="3" fill="#334155"/><path d="M1015.0,299.0 L975.0,204.0" fill="none" stroke="#1c5cab" stroke-width="1.3" opacity="0.9"/><path d="M1017.0,299.0 L987.0,204.0" fill="none" stroke="#1c5cab" stroke-width="1.3" opacity="0.9"/><path d="M1019.0,299.0 L999.0,204.0" fill="none" stroke="#1c5cab" stroke-width="1.3" opacity="0.9"/><path d="M1021.0,299.0 L1011.0,204.0" fill="none" stroke="#1c5cab" stroke-width="1.3" opacity="0.9"/>