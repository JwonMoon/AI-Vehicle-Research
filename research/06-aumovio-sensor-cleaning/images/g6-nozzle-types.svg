chor="start" font-size="13" font-weight="700" fill="#1c5cab">블레이드 슬립스트림 안쪽에 분사</text><text x="764" y="482.0" text-anchor="start" font-size="13" font-weight="400" fill="#1c5cab">→ 제트가 차속·풍압과 무관</text><text x="764" y="518.0" text-anchor="start" font-size="13" font-weight="700" fill="#0f8a5f">물 소비 최대 50% 절감</text><text x="764" y="542.0" text-anchor="start" font-size="13" font-weight="400" fill="#0f8a5f">분사 중 시야 방해 없음</text><text x="764" y="578.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569">보닛 힌지를 넘는 호스</text><text x="764" y="602.0" text-anchor="start" font-size="13" font-weight="400" fill="#475569">배선 불필요 → 조립 단축</text><text x="44" y="642.0" text-anchor="start" font-size="11" font-weight="400" fill="#8a93a0">출처: aumovio.com — Optical Sensors &amp; Windshield Cleaning Systems (2026-09-07 수집)</text>
