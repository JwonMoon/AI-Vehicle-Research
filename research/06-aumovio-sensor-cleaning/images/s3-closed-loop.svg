<text x="44" y="42" text-anchor="start" font-size="20" font-weight="700" fill="#0f172a">특허들이 공유하는 '검출 → 원인 분류 → 대응 선택' 폐루프</text><text x="44" y="68" text-anchor="start" font-size="12.5" font-weight="400" fill="#64748b">Mobileye(2005)·NVIDIA(2017)·Zoox(2019)·GM(2021)·Tesla(2022) 특허의 청구 구조를 한 장으로 겹쳐 그린 것. 각 단계 옆의 회사명은 그 단계를 명시적으로 청구한 특허.</text><rect x="440.0" y="110.0" width="300" height="91" rx="9" fill="#dbeafe" stroke="#1c5cab" stroke-width="1.6"/><text x="590.0" y="141.1" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">① 영상·포인트 품질 관측</text><text x="590.0" y="166.3" text-anchor="middle" font-size="12" font-weight="400" fill="#1e3a8a">엔트로피 · 라플라시안 분산 · 다크채널 ·</text><text x="590.0" y="183.1" text-anchor="middle" font-size="12" font-weight="400" fill="#1e3a8a">스테레오 불일치 · 옵티컬 플로</text><text x="756.0" y="132.0" text-anchor="start" font-size="12" font-weight="600" fill="#1c5cab">NVIDIA · GM · Zoox</text><rect x="440.0" y="245.0" width="300" height="91" rx="9" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.6"/><text x="590.0" y="276.1" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">② 원인 분류 (scene tag)</text><text x="590.0" y="301.3" text-anchor="middle" font-size="12" font-weight="400" fill="#312e81">먼지 · 물방울 · 결로 · 안개 · 글레어 · 렌즈</text><text x="590.0" y="318.1" text-anchor="middle" font-size="12" font-weight="400" fill="#312e81">손상 · 픽셀 결함</text><text x="756.0" y="267.0" text-anchor="start" font-size="12" font-weight="600" fill="#4f46e5">Mobileye · Zoox · Tesla</text><line x1="590.0" y1="205.0" x2="590.0" y2="240.0" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><rect x="44" y="402.0" width="258" height="88" rx="9" fill="#dcfce7" stroke="#0f8a5f" stroke-width="1.6"/><text x="173.0" y="440.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">물리 제거</text><text x="173.0" y="463.9" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">와이퍼 · 세정액 · 히터 · 공기</text><text x="173.0" y="510.0" 