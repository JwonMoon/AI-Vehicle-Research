<text x="44" y="42" text-anchor="start" font-size="20" font-weight="700" fill="#0f172a">오염 검출·보상 특허 20년 — 누가, 언제, 무엇을 청구했나</text><text x="44" y="68" text-anchor="start" font-size="12.5" font-weight="400" fill="#64748b">우선일 기준. 상단은 검출·소프트웨어 대응, 하단은 물리 세정. 같은 회사가 양쪽에 걸치는 시점(Tesla 2022→2025)에 주목.</text><path d="M84,338.0 L1096,338.0" fill="none" stroke="#94a3b8" stroke-width="3"/><path d="M84.0,332.0 L84.0,344.0" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="84.0" y="364.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">2005</text><path d="M228.57142857142858,332.0 L228.57142857142858,344.0" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="228.57142857142858" y="364.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">2008</text><path d="M373.14285714285717,332.0 L373.14285714285717,344.0" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="373.14285714285717" y="364.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">2011</text><path d="M517.7142857142858,332.0 L517.7142857142858,344.0" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="517.7142857142858" y="364.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">2014</text><path d="M662.2857142857143,332.0 L662.2857142857143,344.0" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="662.2857142857143" y="364.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">2017</text><path d="M806.8571428571429,332.0 L806.8571428571429,344.0" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="806.8571428571429" y="364.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">2020</text><path d="M951.4285714285714,332.0 L951.4285714285714,344.0" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="951.4285714285714" y="364.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">2023</text><path d="M1096.0,332.0 L1096.0,344.0" fill="none" stroke="#94a3b8" stroke-widt