="start" font-size="12.5" font-weight="700" fill="#8a93a0">▼ 물리 세정 하드웨어</text><text x="44" y="640" text-anchor="start" font-size="11" font-weight="400" fill="#8a93a0">출처: Google Patents 각 공보(본문 §8 표). 우선일은 공보 기재 기준. 도해는 본 보고서 자작.</text>
