<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 745" width="1180" height="745" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
<rect width="1180" height="745" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c5cab"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f8a5f"/></marker>
</defs>
<text x="44" y="42" text-anchor="start" font-size="20" font-weight="700" fill="#0f172a">센서 오염에 대한 소프트웨어 대응 5계층</text><text x="44" y="68" text-anchor="start" font-size="12.5" font-weight="400" fill="#64748b">아래로 갈수록 '오염을 없애는' 것이 아니라 '오염과 함께 사는' 전략이 된다. 각 층은 독립이 아니라 누적된다.</text><rect x="44" y="108.0" width="1092" height="104" rx="11" fill="#dbeafe" stroke="#1c5cab" stroke-width="1.8"/><text x="66" y="148.0" text-anchor="start" font-size="22" font-weight="800" fill="#1c5cab">L1</text><text x="116" y="142.0" text-anchor="start" font-size="16.5" font-weight="700" fill="#0f172a">검출 · 자기진단</text><text x="116" y="164.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">오염이 있는지, 어디에, 얼마나</text><text x="384" y="138.0" text-anchor="start" font-size="12" font-weight="400" fill="#334155">SoilingNet / TiledSoilingNet (Valeo) · 엔트로피 기반 블록 검출 (NVIDIA 특허) · 가시성 그리드 0–3 (Tesla 특허) ·</text><text x="384" y="156.0" text-anchor="start" font-size="12" font-weight="400" fill="#334155">클러터 리지 분석 (Valeo 레이더 특허)</text><rect x="44" y="222.0" width="1092" height="104" rx="11" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.8"/><text x="66" y="262.0" text-anchor="start" font-size="22" font-weight="800" fill="#4f46e5">L2</text><text x="116" y="256.0" text-anchor="start" font-size="16.5" font-weight="700" fill="#0f172a">복원 · 보정</text><text x="116" y="278.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">잃어버린 픽셀·포인트를 추정</text><text x="384" y="252.0" text-anchor="start" font-size="12" font-weight="400" fill="#334155">CNN 오염 제거 (Eigen 2013) · 물방울 제거 시공간 융합 (Wen 2023) · LiDAR 눈 필터 DROR/DSOR/WeatherNet · 노출·게인</text><text x="384" y="270.0" text-anchor="start" font-size="12" font-weight="400" fill="#334155">재조정 (GM 특허)</text><rect x="44" y="336.0" width="1092" height="104" rx="11" fill="#fdf6e7" stroke="#d9a63f" stroke-width="1.8"/><text x="66" y="376.0" text-anchor="start" font-size="22" font-weight="800" fill="#d9a63f">L3</text><text x="116" y="370.0" text-anchor="start" font-size="16.5" font-weight="700" fill="#0f172a">강건화 · 학습</text><text x="116" y="392.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">오염을 처음부터 견디게 훈련</text><text x="384" y="366.0" text-anchor="start" font-size="12" font-weight="400" fill="#334155">GAN 오염 증강 +18% (Uřičář 2019) · 안개 시뮬레이션 학습 (Hahner ICCV 2021) · 오염 데이터 포함 학습 (LIDAROC) ·</text><text x="384" y="384.0" text-anchor="start" font-size="12" font-weight="400" fill="#334155">밀도 비민감 학습 (Robo3D)</text><rect x="44" y="450.0" width="1092" height="104" rx="11" fill="#dcfce7" stroke="#0f8a5f" stroke-width="1.8"/><text x="66" y="490.0" text-anchor="start" font-size="22" font-weight="800" fill="#0f8a5f">L4</text><text x="116" y="484.0" text-anchor="start" font-size="16.5" font-weight="700" fill="#0f172a">융합 · 중복</text><text x="116" y="506.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">멀쩡한 센서에 무게를 옮김</text><text x="384" y="480.0" text-anchor="start" font-size="12" font-weight="400" fill="#334155">엔트로피 조향 융합 (Bijelic CVPR 2020) · 신뢰도 가중 융합 (ReliFusion 2025) · Zoox 특허: 오염 센서 가중치 축소</text><rect x="44" y="564.0" width="1092" height="104" rx="11" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="66" y="604.0" text-anchor="start" font-size="22" font-weight="800" fill="#dc2626">L5</text><text x="116" y="598.0" text-anchor="start" font-size="16.5" font-weight="700" fill="#0f172a">축퇴 · 인계</text><text x="116" y="620.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">기능을 줄이거나 멈춤</text><text x="384" y="594.0" text-anchor="start" font-size="12" font-weight="400" fill="#334155">Tesla 특허: 가시성 2 초과 다수 → 감속·해제 · Hyundai LKA “Camera obscured” 비활성 · UN R157 전환요구·MRM · SAE</text><text x="384" y="612.0" text-anchor="start" font-size="12" font-weight="400" fill="#334155">J3016 최소위험상태</text><text x="44" y="704.0" text-anchor="start" font-size="11" font-weight="400" fill="#8a93a0">근거: 본문 §4–§5의 논문·특허. 계층 구분과 명칭은 본 보고서의 정리이며 표준 용어가 아니다.</text>
</svg>
