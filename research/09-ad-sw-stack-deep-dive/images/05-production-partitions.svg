dominant-baseline="middle"><tspan x="790.0" dy="0.0">  (AURIX, 벤더) [P22]</tspan></text><text x="790.0" y="174.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="790.0" dy="0.0">DevKit: Renesas U2A16 [N3]</tspan></text><text x="790.0" y="196.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="790.0" dy="0.0"></tspan></text><text x="790.0" y="218.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="790.0" dy="0.0">최종 명령 감시 역할</tspan></text><rect x="786.0" y="256.0" width="176.0" height="64.0" rx="6" fill="#ffffff" fill-opacity="1" stroke="#f59e0b" stroke-width="1" stroke-dasharray="5 4"/><text x="874.0" y="280.5" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" dominant-baseline="middle"><tspan x="874.0" dy="0.0">워치독·명령 감시는</tspan><tspan x="874.0" dy="15.0">이 보고서의 추정 역할</tspan></text><rect x="776.0" y="352.0" width="196.0" height="150.0" rx="8" fill="#f0fdf4" fill-opacity="1" stroke="#16a34a" stroke-width="1.4"/><text x="788.0" y="370.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="788.0" dy="0.0">기록 서브시스템</tspan></text><text x="790.0" y="396.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="790.0" dy="0.0">EDR: 49 CFR 563 [P26]</tspan></text><text x="790.0" y="418.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="790.0" dy="0.0">  8 km/h / 150 ms 트리거</tspan></text><text x="790.0" y="440.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="790.0" dy="0.0">DSSAD: R157 [P28]</tspan></text><text x="790.0" y="462.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="790.0" dy="0.0">IEEE 1616.1-2023 [D32]</tspan></text><rect x="776.0" y="518.0" width="196.0" height="158.0" rx="8" fill="#f5f3ff" fill-opacity="1" stroke="#7c3aed" stroke-width="1.4"/><text x="788.0" y="536.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="788.0" dy="0.0">OTA 클라이언트</tspan></text><text x="790.0" y="562.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="790.0" dy="0.0">이미지 서명: Uptane [P32]</tspan></text><text x="790.0" y="584.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="790.0" dy="0.0">R156 SUMS·RXSWIN</tspan></text><text x="790.0" y="606.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="790.0" dy="0.0">  세부 원문 미확인 ⚠️</tspan></text><text x="790.0" y="628.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="790.0" dy="0.0">A/B 파티션 요구 ⚠️</tspan></text><rect x="44.0" y="700.0" width="330.0" height="70.0" rx="8" fill="#f8fafc" fill-opacity="1" stroke="#9aa5b1" stroke-width="1.2"/><text x="209.0" y="735.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2933" dominant-baseline="middle"><tspan x="209.0" dy="0.0">센서: 카메라 · 레이더 · LiDAR · 초음파</tspan></text><rect x="430.0" y="700.0" width="330.0" height="70.0" rx="8" fill="#f8fafc" fill-opacity="1" stroke="#9aa5b1" stroke-width="1.2"/><text x="595.0" y="735.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2933" dominant-baseline="middle"><tspan x="595.0" dy="0.0">차량 DBW · 액추에이터</tspan></text><line x1="209.0" y1="700.0" x2="209.0" y2="678.0" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><line x1="595.0" y1="678.0" x2="595.0" y2="698.0" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><text x="645.0" y="689.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#52606d" dominant-