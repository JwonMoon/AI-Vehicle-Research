nt-baseline="middle"><tspan x="1028.0" dy="0.0">ISO/PAS 8800</tspan></text><text x="1028.0" y="286.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="1028.0" dy="0.0">데이터셋·학습·모델 검증</tspan></text><text x="1486.0" y="262.0" font-size="11" font-weight="400" text-anchor="end" fill="#52606d" dominant-baseline="middle"><tspan x="1486.0" dy="0.0">[D66][D33]</tspan></text><rect x="1010.0" y="318.0" width="486.0" height="66.0" rx="6" fill="#ffffff" fill-opacity="1" stroke="#e5e7eb" stroke-width="1"/><rect x="1010" y="318" width="6" height="66" fill="#52606d"/><text x="1028.0" y="338.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="1028.0" dy="0.0">ISO/SAE 21434 · R155</tspan></text><text x="1028.0" y="362.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="1028.0" dy="0.0">부트체인·통신·전 층 (세부 원문 ⚠️)</tspan></text><text x="1486.0" y="338.0" font-size="11" font-weight="400" text-anchor="end" fill="#52606d" dominant-baseline="middle"><tspan x="1486.0" dy="0.0">[N2][P14]</tspan></text><rect x="1010.0" y="394.0" width="486.0" height="66.0" rx="6" fill="#ffffff" fill-opacity="1" stroke="#e5e7eb" stroke-width="1"/><rect x="1010" y="394" width="6" height="66" fill="#7c3aed"/><text x="1028.0" y="414.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="1028.0" dy="0.0">UN R156</tspan></text><text x="1028.0" y="438.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="1028.0" dy="0.0">OTA·SW 버전 관리 (세부 원문 ⚠️)</tspan></text><text x="1486.0" y="414.0" font-size="11" font-weight="400" text-anchor="end" fill="#52606d" dominant-baseline="middle"><tspan x="1486.0" dy="0.0">—</tspan></text><rect x="1010.0" y="470.0" width="486.0" height="66.0" rx="6" fill="#ffffff" fill-opacity="1" stroke="#e5e7eb" stroke-width="1"/><rect x="1010" y="470" width="6" height="66" fill="#16a34a"/><text x="1028.0" y="490.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="1028.0" dy="0.0">49 CFR 563 · R160 · DSSAD</tspan></text><text x="1028.0" y="514.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="1028.0" dy="0.0">기록 서브시스템</tspan></text><text x="1486.0" y="490.0" font-size="11" font-weight="400" text-anchor="end" fill="#52606d" dominant-baseline="middle"><tspan x="1486.0" dy="0.0">[P26][P40][D32]</tspan></text><rect x="1010.0" y="546.0" width="486.0" height="66.0" rx="6" fill="#ffffff" fill-opacity="1" stroke="#e5e7eb" stroke-width="1"/><rect x="1010" y="546" width="6" height="66" fill="#f59e0b"/><text x="1028.0" y="566.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="1028.0" dy="0.0">UL 4600</tspan></text><text x="1028.0" y="590.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="1028.0" dy="0.0">시스템 전체 안전 논증(safety case)</tspan></text><text x="1486.0" y="566.0" font-size="11" font-weight="400" text-anchor="end" fill="#52606d" dominant-baseline="middle"><tspan x="1486.0" dy="0.0">[P27][D68]</tspan></text><rect x="1010.0" y="622.0" width="486.0" height="66.0" rx="6" fill="#ffffff" fill-opacity="1" stroke="#e5e7eb" stroke-width="1"/><rect x="1010" y="622" width="6" height="66" fill="#52606d"/><text x="1028.0" y="642.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="1028.0" dy="0.0">EU AI Act</tspan></text><text x="1028.0" y="666.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="1028.0" dy="0.0">차량 AI는 형식승인 규정 경로로 흡수</tspan></text><text x="1486.0" y="642.0" font-size="11" font-weight="400" text-anchor="end" fill="#52606d" dominant-baseline="middle"><tspan x="1486.0" dy="0.0">[P2] 📄</tspan></text><rect x="1010.0" y="698.0" width="486.0" height="66.0" rx="6" fill="#ffffff" fill-opacity="1" stroke="#e5e7eb" stroke-width="1"/><rect x="1010" y="698" width="6" height="66" fill="#52606d"/><text x="1028.0" y="718.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="1028.0" dy="0.0">UNECE ADS 규정·GTR</tspan></text><text x="1028.0" y="742.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="1028.0" dy="0.0">기술 중립적 입증 (2025-09 GRVA 채택)</tspan></text><text x="1486.0" y="718.0" font-size="11" font-weight="400" text-anchor="end" fill="#52606d" dominant-baseline="middle"><tspan x="1486.0" dy="0.0">[F33] 📄</tspan></text><text x="24.0" y="818.0" font-size="12" font-weight="400" text-anchor="start" fill="#52606d" dominant-baseline="middle"><tspan x="24.0" dy="0.0">개념도(분석): 제품 예시는 각 출처의 벤더 주장이며, 실제 파티션 구성은 벤더·OEM마다 다르다. 점선 상자는 공식 출처 없이 이 보고서가 추정한 역할이다.</tspan></text><text x="24.0" y="842.0" font-size="12" font-weight="400" text-anchor="start" fill="#52606d" dominant-baseline="middle"><tspan x="24.0" dy="0.0">EB corbos Linux의 ASIL B 주장 근거는 인증서가 아니라 TÜV Nord &quot;feasibility report&quot;로 표기돼 있다 [P6]. 색 막대는 왼쪽 상자 색과 대응한다.</tspan></text></svg>