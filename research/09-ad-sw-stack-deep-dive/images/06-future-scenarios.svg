<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="1400" height="880" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="미래 스택 시나리오 매트릭스"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs><rect width="1400" height="880" fill="#ffffff"/><text x="700.0" y="26.0" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2933" dominant-baseline="middle"><tspan x="700.0" dy="0.0">미래 스택 시나리오 — 온보드 모델 형태 × 안전 구조</tspan></text><rect x="110.0" y="70.0" width="700.0" height="700.0" rx="4" fill="#ffffff" fill-opacity="1" stroke="#9aa5b1" stroke-width="1.4"/><line x1="460.0" y1="70" x2="460.0" y2="770" stroke="#cbd2d9" stroke-dasharray="6 6"/><line x1="110" y1="420.0" x2="810" y2="420.0" stroke="#cbd2d9" stroke-dasharray="6 6"/><text x="126.0" y="95.0" font-size="13" font-weight="700" text-anchor="start" fill="#334e68" dominant-baseline="middle"><tspan x="126.0" dy="0.0">A. 클라우드 teacher + 온보드 student</tspan><tspan x="126.0" dy="18.0">+ 독립 검증층</tspan></text><text x="476.0" y="95.0" font-size="13" font-weight="700" text-anchor="start" fill="#334e68" dominant-baseline="middle"><tspan x="476.0" dy="0.0">B. 온보드 대형 모델</tspan><tspan x="476.0" dy="18.0">+ 독립 검증층</tspan></text><text x="126.0" y="445.0" font-size="13" font-weight="700" text-anchor="start" fill="#334e68" dominant-baseline="middle"><tspan x="126.0" dy="0.0">C. 단일 네트워크</tspan><tspan x="126.0" dy="18.0">증류 배포</tspan></text><text x="476.0" y="445.0" font-size="13" font-weight="700" text-anchor="start" fill="#334e68" dominant-baseline="middle"><tspan x="476.0" dy="0.0">D. 단일 대형 네트워크</tspan><tspan x="476.0" dy="18.0">스케일업</tspan></text><text x="460.0" y="800.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#52606d" dominant-baseline="middle"><tspan x="460.0" dy="0.0">← 증류 student 온보드 · 클라우드 teacher        온보드 모델 형태        대형 VLA·WAM 온보드 →</tspan></text><text x="70" y="420.0" font-size="12.5" font-weight="600" fill="#52606d" text-anchor="middle" transform="rotate(-90 70 420.0)">← 단일 학습 네트워크 중심        안전 구조        학습 + 독립 검증층 →</text><circle cx="236.0" cy="168.0" r="9" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="2"/><text x="252.0" y="166.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="252.0" dy="0.0">Waymo</tspan></text><text x="252.0" y="184.0" font-size="11" font-weight="400" text-anchor="start" fill="#52606d" dominant-baseline="middle"><tspan x="252.0" dy="0.0">Teacher→Student 증류</tspan><tspan x="252.0" dy="14.0">&quot;separate and rigorous onboard</tspan><tspan x="252.0" dy="14.0">validation layer&quot; [F1]</tspan></text><circle cx="320.0" cy="266.0" r="9" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="2"/><text x="336.0" y="264.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="336.0" dy="0.0">NVIDIA DRIVE AV</tspan></text><text x="336.0" y="289.0" font-size="11" font-weight="400" text-anchor="start" fill="#52606d" dominant-baseline="middle"><tspan x="336.0" dy="0.0">증류 Alpamayo + 병렬</tspan><tspan x="336.0" dy="14.0">클래식 안전 스택 [N1][N18]</tspan></text><circle cx="418.0" cy="210.0" r="9" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="2"/><text x="434.0" y="208.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="434.0" dy="0.0">Autoware 2.0</tspan></text><text x="434.0" y="233.0" font-size="11" font-weight="400" text-anchor="start" fill="#52606d" dominant-baseline="middle"><tspan x="434.0" dy="0.0">Generator–Selector</tspan><tspan x="434.0" dy="14.0">(안전 평가 TBD) [A26][A28]</tspan></text><circle cx="670.0" cy="420.0" r="9" fill="#ffffff" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="4 3"/><text x="686.0" y="418.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="686.0" dy="0.0">XPeng VLA 2.0</tspan></text><text x="686.0" y="436.0" font-size="11" font-weight="400" text-anchor="start" fill="#52606d" dominant-baseline="middle"><tspan x="686.0" dy="0.0">클라우드 72B → 차량 모델 [E53]</tspan><tspan x="686.0" dy="14.0">Turing ≤30B 수용 [F14] 📄</tspan><tspan x="686.0" dy="14.0">안전 구조 공식 자료 미확인</tspan></text><circle cx="600.0" cy="532.0" r="9" fill="#ffffff" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="4 3"/><text x="616.0" y="530.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="616.0" dy="0.0">Huawei ADS 4 (WA)</tspan></text><text x="616.0" y="555.0" font-size="11" font-weight="400" text-anchor="start" fill="#52606d" dominant-baseline="middle"><tspan x="616.0" dy="0.0">언어 단계 없는 WA [E58] 📄</tspan><tspan x="616.0" dy="14.0">공식 원문 미확인</tspan></text><circle cx="530.0" cy="672.0" r="9" fill="#ffffff" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="4 3"/><text x="546.0" y="670.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="546.0" dy="0.0">Tesla FSD</tspan></text><text x="546.0" y="695.0" font-size="11" font-weight="400" text-anchor="start" fill="#52606d" dominant-baseline="middle"><tspan x="546.0" dy="0.0">단일 E2E 네트워크 [E34]</tspan><tspan x="546.0" dy="14.0">HW3용 증류판 보도 [F11] 📄</tspan></text><text x="850.0" y="80.0" font-size="14" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="850.0" dy="0.0">불확실성 변수 — 방향을 가를 증거</tspan></text><rect x="850.0" y="100.0" width="520.0" height="104.0" rx="8" fill="#fbf7ee" fill-opacity="1" stroke="#e2cfa3" stroke-width="1.2"/><text x="866.0" y="122.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="866.0" dy="0.0">폐루프 RL의 실효성</tspan></text><text x="866.0" y="153.5" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="866.0" dy="0.0">인간 궤적 감독 없이 nuPlan 93.57 [F23]</tspan><tspan x="866.0" dy="17.0">↔ 순수 self-play는 학습 상대에 과적합 [F25]</tspan></text><rect x="850.0" y="218.0" width="520.0" height="104.0" rx="8" fill="#fbf7ee" fill-opacity="1" stroke="#e2cfa3" stroke-width="1.2"/><text x="866.0" y="240.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="866.0" dy="0.0">온보드 지연</tspan></text><text x="866.0" y="271.5" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="866.0" dy="0.0">Alpamayo 1.5 W4A8: 717 → 151 ms, 단일 GPU [F5]</tspan><tspan x="866.0" dy="17.0">&quot;language is expensive onboard&quot; [F6]</tspan></text><rect x="850.0" y="336.0" width="520.0" height="104.0" rx="8" fill="#fbf7ee" fill-opacity="1" stroke="#e2cfa3" stroke-width="1.2"/><text x="866.0" y="358.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="866.0" dy="0.0">추론의 충실도</tspan></text><text x="866.0" y="389.5" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="866.0" dy="0.0">Alpamayo-R1-10B 추론 충실도 42.5%,</tspan><tspan x="866.0" dy="17.0">&#x27;정지&#x27; 서술 중 37.9%는 계속 주행 [F31]</tspan></text><rect x="850.0" y="454.0" width="520.0" height="104.0" rx="8" fill="#fbf7ee" fill-opacity="1" stroke="#e2cfa3" stroke-width="1.2"/><text x="866.0" y="476.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="866.0" dy="0.0">메모리 대역폭</tspan></text><text x="866.0" y="516.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="866.0" dy="0.0">Thor 273 GB/s [N3] · NX9031 546 GB/s [F15] 📄</tspan></text><rect x="850.0" y="572.0" width="520.0" height="104.0" rx="8" fill="#fbf7ee" fill-opacity="1" stroke="#e2cfa3" stroke-width="1.2"/><text x="866.0" y="594.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="866.0" dy="0.0">규제</tspan></text><text x="866.0" y="625.5" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" dominant-baseline="middle"><tspan x="866.0" dy="0.0">UNECE ADS 규정: 기술 중립, &quot;competent and</tspan><tspan x="866.0" dy="17.0">careful human driver&quot; 기준 [F33] 📄</tspan></text><text x="24.0" y="830.0" font-size="12" font-weight="400" text-anchor="start" fill="#52606d" dominant-baseline="middle"><tspan x="24.0" dy="0.0">위치는 공개 발표를 근거로 이 보고서가 배치한 분석이다. 채운 원 = 두 축 모두 공식 출처로 확인. 점선 원 = 한 축 이상이 서드파티 자료이거나 미확인.</tspan></text><text x="24.0" y="854.0" font-size="12" font-weight="400" text-anchor="start" fill="#52606d" dominant-baseline="middle"><tspan x="24.0" dy="0.0">출처: 보고서 5부 [F1][F5][F6][F11][F14][F15][F23][F25][F31][F33], 2부 [N1][N3][N18][A26][A28], 1부 [E34][E53][E58].</tspan></text></svg>