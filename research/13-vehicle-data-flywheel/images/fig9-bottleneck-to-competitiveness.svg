<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="511" viewBox="0 0 1240 511" font-family="IBM Plex Sans KR, Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4b5563"/></marker></defs>
<title>병목에서 경쟁력으로</title>
<rect width="1240" height="511" fill="#ffffff"/>
<text x="24" y="32" font-size="17" fill="#111827" font-weight="700">네 가지 병목을 풀면 다섯 가지 경쟁력으로 이어진다</text>
<text x="24" y="52" font-size="11.5" fill="#6b7280">왼쪽 병목(5.1~5.4절) → 가운데 푸는 기술 → 오른쪽 사업 경쟁력(5.5절). 선은 본문에서 근거를 든 연결만 그렸다. 자체 작성.</text>
<text x="24" y="96" font-size="13.5" fill="#b91c1c" font-weight="700">병목</text>
<text x="440" y="96" font-size="13.5" fill="#374151" font-weight="700">푸는 기술</text>
<text x="880" y="96" font-size="13.5" fill="#059669" font-weight="700">사업 경쟁력</text>
<rect x="24" y="110" width="330" height="55.809999999999974" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="34" y="133.65" font-size="13" fill="#111827" font-weight="700">① 데이터 발견</text>
<text x="34" y="152.015" font-size="11.5" fill="#374151">무엇을 찾아야 할지 모른다 (SOTIF 영역 3)</text>
<rect x="24" y="187.80999999999997" width="330" height="55.809999999999974" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="34" y="211.45999999999998" font-size="13" fill="#111827" font-weight="700">② 검증</text>
<text x="34" y="229.82499999999996" font-size="11.5" fill="#374151">시뮬레이션을 얼마나 믿을 수 있나 (sim-to-real 격차)</text>
<rect x="24" y="265.61999999999995" width="330" height="55.81" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="34" y="289.2699999999999" font-size="13" fill="#111827" font-weight="700">③ 비용</text>
<text x="34" y="307.63499999999993" font-size="11.5" fill="#374151">저장 · 통신 · GPU · 라벨링</text>
<rect x="24" y="343.42999999999995" width="330" height="55.81" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="34" y="367.0799999999999" font-size="13" fill="#111827" font-weight="700">④ 규제 · 데이터 주권</text>
<text x="34" y="385.44499999999994" font-size="11.5" fill="#374151">개인정보 · 국외 반출 · UN R155/R156 · EU AI Act</text>
<rect x="440" y="110" width="340" height="55.119999999999976" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.2"/>
<text x="450" y="133.125" font-size="12.5" fill="#111827" font-weight="700">임베딩 검색 · 생성형 월드모델</text>
<text x="450" y="151.325" font-size="11.5" fill="#374151">못 본 상황을 찾고 만든다</text>
<rect x="440" y="187.11999999999998" width="340" height="55.119999999999976" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.2"/>
<text x="450" y="210.24499999999998" font-size="12.5" fill="#111827" font-weight="700">재구성 시뮬 · 회귀 세트 · 실차 대조</text>
<text x="450" y="228.44499999999996" font-size="11.5" fill="#374151">시뮬 점수와 실차 결과를 맞춘다</text>
<rect x="440" y="264.23999999999995" width="340" height="55.120000000000005" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.2"/>
<text x="450" y="287.36499999999995" font-size="12.5" fill="#111827" font-weight="700">온보드 선별 · 자동 라벨링</text>
<text x="450" y="305.56499999999994" font-size="11.5" fill="#374151">올리는 양과 사람 손을 줄인다</text>
<rect x="440" y="341.35999999999996" width="340" height="55.120000000000005" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.2"/>
<text x="450" y="364.48499999999996" font-size="12.5" fill="#111827" font-weight="700">현지 인프라 · SUMS · 증거로서의 로깅</text>
<text x="450" y="382.68499999999995" font-size="11.5" fill="#374151">규제를 아키텍처에 넣는다</text>
<rect x="880" y="110" width="336" height="55.809999999999974" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="890" y="133.65" font-size="13" fill="#111827" font-weight="700">개발 속도</text>
<text x="890" y="152.015" font-size="11.5" fill="#374151">트리거 → 배포 한 바퀴가 짧다 (주 단위 OTA)</text>
<rect x="880" y="177.80999999999997" width="336" height="55.809999999999974" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="890" y="201.45999999999998" font-size="13" fill="#111827" font-weight="700">원가</text>
<text x="890" y="219.82499999999996" font-size="11.5" fill="#374151">라벨 비용이 GPU 시간에 비례, 반출 비용 절감</text>
<rect x="880" y="245.61999999999995" width="336" height="55.81" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="890" y="269.2699999999999" font-size="13" fill="#111827" font-weight="700">시장 확장</text>
<text x="890" y="287.63499999999993" font-size="11.5" fill="#374151">현지 데이터 없이 진입, 빠른 현지화</text>
<rect x="880" y="313.42999999999995" width="336" height="55.81" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="890" y="337.0799999999999" font-size="13" fill="#111827" font-weight="700">안전성 입증</text>
<text x="890" y="355.44499999999994" font-size="11.5" fill="#374151">플릿 통계 · 시뮬 · 회귀 세트가 안전 케이스 증거</text>
<rect x="880" y="381.23999999999995" width="336" height="55.81" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="890" y="404.88999999999993" font-size="13" fill="#111827" font-weight="700">장기 검증 자산</text>
<text x="890" y="423.25499999999994" font-size="11.5" fill="#374151">시나리오 · 회귀 세트가 다음 모델·차종에도 쓰인다</text>
<line x1="354" y1="137.90499999999997" x2="436" y2="137.56" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="354" y1="215.71499999999997" x2="436" y2="214.67999999999995" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="354" y1="293.525" x2="436" y2="291.79999999999995" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="354" y1="371.3349999999999" x2="436" y2="368.91999999999996" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#arr)"/>
