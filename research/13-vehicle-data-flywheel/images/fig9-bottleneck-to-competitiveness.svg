<rect x="24" y="455.04999999999995" width="1192" height="40" rx="6" fill="#fff" stroke="#374151" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="36" y="479.04999999999995" font-size="12" fill="#111827" font-weight="700">공통 조건 = 한 바퀴를 얼마나 자주 · 얼마나 싸게 · 얼마나 믿을 수 있게 돌리느냐. 네 병목은 바로 이 세 변수를 막는 곳이다.</text>
