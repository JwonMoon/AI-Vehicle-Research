<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="430" viewBox="0 0 1240 430" font-family="IBM Plex Sans KR, Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4b5563"/></marker></defs>
<title>온보드 선별과 두 단계 업로드</title>
<rect width="1240" height="430" fill="#ffffff"/>
<text x="24" y="32" font-size="17" fill="#111827" font-weight="700">차 안에서 고르고, 요약본을 먼저 올리고, 원본은 서버가 지목할 때만 올린다</text>
<text x="24" y="52" font-size="11.5" fill="#6b7280">단계 ①②(2.2절)의 흐름. 주황 = 차 안, 파랑 = 클라우드. 실선 = openpilot 코드·Tesla 발표로 확인, 점선 = 일반화한 설명. 자체 작성.</text>

<!-- vehicle zone -->
<rect x="24" y="76" width="760" height="320" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
<text x="40" y="100" font-size="13" fill="#b45309" font-weight="700">차 안(온보드)</text>
<!-- cloud zone -->
<rect x="820" y="76" width="396" height="320" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="836" y="100" font-size="13" fill="#1e40af" font-weight="700">클라우드</text>

<!-- sensors -->
<rect x="40" y="120" width="170" height="70" rx="8" fill="#ffffff" stroke="#9ca3af"/>
<text x="125" y="146" font-size="12.5" fill="#111827" font-weight="600" text-anchor="middle">센서 원본</text>
<text x="125" y="166" font-size="11" fill="#6b7280" text-anchor="middle">카메라·라이다·차량 신호</text>
<text x="125" y="181" font-size="11" fill="#6b7280" text-anchor="middle">시간당 수십 GB~수 TB</text>

<!-- trigger -->
<line x1="210" y1="155" x2="262" y2="155" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="268" y="112" width="220" height="86" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
<text x="378" y="136" font-size="12.5" fill="#111827" font-weight="600" text-anchor="middle">트리거 — 올릴 순간을 판단</text>
<text x="378" y="156" font-size="11" fill="#374151" text-anchor="middle">규칙(개입·급제동·충돌)</text>
<text x="378" y="171" font-size="11" fill="#374151" text-anchor="middle">모델 점수(드문 장면, 두 모델 불일치)</text>
<text x="378" y="186" font-size="11" fill="#374151" text-anchor="middle">사람(운전자 버튼)</text>

<!-- shadow -->
<rect x="268" y="214" width="220" height="56" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="378" y="237" font-size="12" fill="#111827" font-weight="600" text-anchor="middle">섀도 모드</text>
<text x="378" y="255" font-size="11" fill="#374151" text-anchor="middle">후보 모델은 판단만 기록, 운전은 안 함</text>
<line x1="378" y1="214" x2="378" y2="204" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>

<!-- storage: summary + original -->
<line x1="488" y1="155" x2="540" y2="155" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="546" y="112" width="220" height="60" rx="8" fill="#ffffff" stroke="#9ca3af"/>
<text x="656" y="136" font-size="12.5" fill="#111827" font-weight="600" text-anchor="middle">요약본</text>
<text x="656" y="156" font-size="11" fill="#374151" text-anchor="middle">핵심 신호 + 저화질 영상 (작음)</text>
<rect x="546" y="190" width="220" height="60" rx="8" fill="#ffffff" stroke="#9ca3af"/>
<text x="656" y="214" font-size="12.5" fill="#111827" font-weight="600" text-anchor="middle">원본</text>
<text x="656" y="234" font-size="11" fill="#374151" text-anchor="middle">전체 로그 + 고화질 영상 (큼), 차에 보관</text>
<text x="656" y="290" font-size="11" fill="#6b7280" text-anchor="middle">저장 공간이 부족할 때만 오래된 것부터 삭제,</text>
<text x="656" y="305" font-size="11" fill="#6b7280" text-anchor="middle">운전자가 표시한 구간은 보존(openpilot)</text>

<!-- 1st upload -->
<line x1="766" y1="142" x2="860" y2="142" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
<text x="813" y="132" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="600">① 먼저 올림</text>
<rect x="866" y="112" width="330" height="60" rx="8" fill="#ffffff" stroke="#2563eb"/>
<text x="1031" y="136" font-size="12.5" fill="#111827" font-weight="600" text-anchor="middle">요약본 검토·검색</text>
<text x="1031" y="156" font-size="11" fill="#374151" text-anchor="middle">드문 장면·개입 구간을 골라 "이 구간 원본" 지목</text>

<!-- request back -->
<line x1="866" y1="195" x2="772" y2="213" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="822" y="192" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="600">② 원본 요청</text>

<!-- 2nd upload -->
<line x1="766" y1="240" x2="860" y2="240" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
<text x="813" y="258" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="600">③ 지목된 원본만 올림</text>
<rect x="866" y="212" width="330" height="60" rx="8" fill="#ffffff" stroke="#2563eb"/>
<text x="1031" y="236" font-size="12.5" fill="#111827" font-weight="600" text-anchor="middle">원본 저장 → 검색·라벨링(3.2절)</text>
<text x="1031" y="256" font-size="11" fill="#374151" text-anchor="middle">올리지 않은 데이터는 저장·라벨링 비용 0</text>

<text x="836" y="320" font-size="11" fill="#6b7280">Tesla: 트리거 221개, 약 10초 클립(2021) [보도]</text>
<text x="836" y="338" font-size="11" fill="#6b7280">openpilot: 1분 세그먼트, 요약본 우선, 서버 요청 시 원본 [원문]</text>
<text x="836" y="356" font-size="11" fill="#6b7280">Mobileye: 원본 대신 의미 정보만 km당 10KB [보도]</text>
<text x="836" y="374" font-size="11" fill="#6b7280">현대차그룹: Hard Example Mining으로 자동 선별 [보도]</text>
</svg>
