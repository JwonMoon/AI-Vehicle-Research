<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <style>
    .band-label{font-size:12px;font-weight:700;fill:#2b3446}
    .band-sub{font-size:10px;fill:#5b6472}
    .box{fill:#ffffff;stroke:#5f7f3f;stroke-width:1.3;rx:6}
    .box-inf{fill:#fffaf0;stroke:#c98a00;stroke-width:1.3;stroke-dasharray:5 4;rx:6}
    .box-t{font-size:12px;fill:#1e2430;font-weight:600}
    .box-s{font-size:10px;fill:#4a5568}
    .title{font-size:16px;font-weight:800;fill:#1e2430}
    .legend{font-size:11px;fill:#4a5568}
    .note{font-size:10px;fill:#8a5a00}
  </style>

  <text x="16" y="26" class="title">차량 탑재 참조 스택 (NVIDIA DRIVE) — 층별 구성은 공식 문서 확인, Alpamayo 결합부만 추론(점선)</text>

  <!-- 앱/AV 스택 -->
  <rect x="16" y="42" width="880" height="86" fill="#eef6e0" stroke="#cfe3ad" rx="8"/>
  <text x="26" y="60" class="band-label">앱 / AV 스택</text>
  <rect x="150" y="52" width="300" height="66" class="box"/>
  <text x="160" y="72" class="box-t">DRIVE AV software</text>
  <text x="160" y="88" class="box-s">"purpose-built for L4 autonomy"</text>
  <text x="160" y="102" class="box-s">실시간 처리·보안·시스템 모니터링</text>
  <rect x="462" y="52" width="420" height="66" class="box-inf"/>
  <text x="472" y="72" class="box-t">Alpamayo distilled student 주행 정책 + downstream planner</text>
  <text x="472" y="88" class="note">추론 — 보도자료 "downstream AV stack built on Alpamayo" ·</text>
  <text x="472" y="102" class="note">"distilled compact models run on DRIVE AGX Thor" 발언 기반, 통합 구조 미공개</text>

  <!-- AI 런타임 -->
  <rect x="16" y="136" width="880" height="76" fill="#e4f0d0" stroke="#c4dc9a" rx="8"/>
  <text x="26" y="154" class="band-label">AI 런타임</text>
  <rect x="150" y="146" width="100" height="56" class="box"/>
  <text x="160" y="178" class="box-t">CUDA</text>
  <rect x="258" y="146" width="100" height="56" class="box"/>
  <text x="268" y="178" class="box-t">cuDNN</text>
  <rect x="366" y="146" width="110" height="56" class="box"/>
  <text x="376" y="178" class="box-t">TensorRT</text>
  <rect x="488" y="146" width="394" height="56" class="box-inf"/>
  <text x="498" y="166" class="box-t">FP8 / NVFP4 체크포인트 실행</text>
  <text x="498" y="182" class="note">추론 — quant recipe(사실) + Thor FP4 가속(사실)의 결합.</text>
  <text x="498" y="196" class="note">"차량 추론=TensorRT 계열" 직접 명시 문서는 없음</text>

  <!-- 미들웨어 -->
  <rect x="16" y="220" width="880" height="76" fill="#e3edf7" stroke="#b9d2ea" rx="8"/>
  <text x="26" y="238" class="band-label">미들웨어</text>
  <text x="26" y="252" class="band-sub">DriveWorks SDK</text>
  <rect x="150" y="230" width="190" height="56" class="box"/>
  <text x="160" y="250" class="box-t">SAL 센서 추상화</text>
  <text x="160" y="266" class="box-s">"abstraction between physical</text>
  <text x="160" y="279" class="box-s">sensor models and applications"</text>
  <rect x="352" y="230" width="180" height="56" class="box"/>
  <text x="362" y="250" class="box-t">이미지·포인트클라우드</text>
  <text x="362" y="266" class="box-s">전처리·특징 추출·스티칭</text>
  <rect x="544" y="230" width="160" height="56" class="box"/>
  <text x="554" y="250" class="box-t">동적 캘리브레이션</text>
  <text x="554" y="266" class="box-s">런타임 파라미터 재추정</text>
  <rect x="716" y="230" width="166" height="56" class="box"/>
  <text x="726" y="250" class="box-t">Egomotion 모듈</text>
  <text x="726" y="266" class="box-s">차량 자세 추적·예측</text>

  <!-- OS/BSP -->
  <rect x="16" y="304" width="880" height="104" fill="#eceff4" stroke="#d4dae4" rx="8"/>
  <text x="26" y="322" class="band-label">OS / BSP</text>
  <text x="26" y="336" class="band-sub">DriveOS</text>
  <text x="26" y="350" class="band-sub">(ASPICE·ISO 26262</text>
  <text x="26" y="362" class="band-sub">·ISO/SAE 21434)</text>
  <rect x="150" y="314" width="180" height="40" class="box"/>
  <text x="160" y="331" class="box-t">게스트 OS</text>
  <text x="160" y="347" class="box-s">Linux 또는 QNX</text>
  <rect x="342" y="314" width="230" height="40" class="box"/>
  <text x="352" y="331" class="box-t">Hypervisor</text>
  <text x="352" y="347" class="box-s">"manages resources, abstraction between HW and OS"</text>
  <rect x="584" y="314" width="298" height="40" class="box"/>
  <text x="594" y="331" class="box-t">개발 접근</text>
  <text x="594" y="347" class="box-s">DRIVE AGX SDK Developer Program 가입 필요(gated)</text>
  <rect x="150" y="360" width="330" height="40" class="box"/>
  <text x="160" y="377" class="box-t">NvMedia</text>
  <text x="160" y="393" class="box-s">"camera frames are directly loaded into GPU memory"</text>
  <rect x="492" y="360" width="390" height="40" class="box"/>
  <text x="502" y="377" class="box-t">NvStreams</text>
  <text x="502" y="393" class="box-s">zero-copy 데이터 전송</text>

  <!-- HW -->
  <rect x="16" y="416" width="880" height="86" fill="#dfe3e9" stroke="#c5cbd6" rx="8"/>
  <text x="26" y="434" class="band-label">HW 플랫폼</text>
  <text x="26" y="448" class="band-sub">DRIVE Hyperion</text>
  <rect x="150" y="426" width="400" height="66" class="box"/>
  <text x="160" y="446" class="box-t">DRIVE AGX Thor ×2 (단일 보드)</text>
  <text x="160" y="462" class="box-s">Blackwell GPU · "1,000 INT8 TOPS (2,000 FP4 TFLOPs)"</text>
  <text x="160" y="476" class="box-s">14x Arm Neoverse V3AE · LPDDR5X 273GB/s · ASIL-D 설계</text>
  <rect x="562" y="426" width="320" height="66" class="box"/>
  <text x="572" y="446" class="box-t">인증 멀티모달 센서 셋</text>
  <text x="572" y="462" class="box-s">"14 high-definition cameras, nine radars,</text>
  <text x="572" y="476" class="box-s">one lidar, and 12 ultrasonics"</text>

  <!-- Halos side rail -->
  <rect x="906" y="42" width="138" height="460" fill="#fdf3f3" stroke="#e2b6b6" rx="8"/>
  <text x="920" y="64" class="band-label">안전 프레임워크</text>
  <rect x="918" y="76" width="114" height="86" class="box"/>
  <text x="928" y="96" class="box-t">NVIDIA Halos</text>
  <text x="928" y="112" class="box-s">PlusAI 3축 중 하나:</text>
  <text x="928" y="126" class="box-s">"safety through</text>
  <text x="928" y="140" class="box-s">NVIDIA Halos"</text>
  <text x="920" y="186" class="band-sub">상세는 본 조사</text>
  <text x="920" y="199" class="band-sub">범위 밖(미조사)</text>

  <!-- legend -->
  <rect x="16" y="512" width="1028" height="92" fill="#fbfcf9" stroke="#e3e7ee" rx="8"/>
  <rect x="30" y="526" width="26" height="14" class="box"/>
  <text x="64" y="537" class="legend">실선 = NVIDIA 공식 문서 원문 확인(🔍): DriveOS·DriveWorks·in-vehicle computing(Hyperion)·Thor 개발킷 블로그·PlusAI 발표</text>
  <rect x="30" y="548" width="26" height="14" class="box-inf"/>
  <text x="64" y="559" class="legend">점선 = 추론 — Alpamayo가 이 스택에 통합되는 위치·방식은 NVIDIA 미공개. 배치 근거는 보도자료 발언(teacher→distill→Thor)</text>
  <text x="30" y="581" class="legend">주의: 이 그림은 "NVIDIA DRIVE 참조 스택(사실)" 위에 "Alpamayo 배포 발언(사실)"을 겹쳐 그린 참조도 — 결합 그 자체는 추론임</text>
  <text x="30" y="597" class="legend">정합성 참고: Hyperion 카메라 14개 ⊃ 학습 데이터셋 카메라 7개 구성 — 공식 매핑 문서 없음(추론)</text>
</svg>
